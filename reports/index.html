<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portal RTM · Grupo Naval</title>
    <meta
      name="description"
      content="Portal RTM do Grupo Naval Angola: vendas do Pinguim BO por promotor, dia e cliente, recebimentos, carga das carrinhas e carteira de clientes."
    />
    <link rel="icon" type="image/png" href="../assets/naval-emblema.png" />
    <!-- App instalável (iPhone: Safari › Partilhar › Adicionar ao ecrã principal; Android: Instalar) -->
    <link rel="manifest" href="../manifest.webmanifest" />
    <meta name="theme-color" content="#273777" />
    <link rel="apple-touch-icon" sizes="180x180" href="../app/icones/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Equipamentos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script src="../app/registar.js" defer></script>
    <!-- Letra Inter servida pelo portal (sem pedidos a sites externos antes de desenhar) -->
    <link rel="stylesheet" href="../assets/fontes/inter.css" />
    <!-- Estilos e código do portal: reports/css/ e reports/js/ (módulos ES). O tema aplica-se antes de desenhar. -->
    <script src="js/tema-arranque.js"></script>
    <link rel="stylesheet" href="css/cores.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tema.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/paginas.css" />
    <link rel="stylesheet" href="css/claro.css" />
  </head>

  <body>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="ld-box">
        <div class="ld-logo" aria-hidden="true">
          <span class="ld-anel"></span><span class="ld-anel"></span><span class="ld-anel"></span><span class="ld-orbita"></span
          ><img src="../assets/naval-emblema.png" alt="" />
        </div>
        <div class="ld-titulo" id="ld-titulo">Portal RTM</div>
        <div class="ld-sub" id="ld-sub">A preparar os relatórios…</div>
        <div class="ld-barra"><i id="ld-barra"></i></div>
        <ul class="ld-passos" id="ld-passos"></ul>
      </div>
    </div>
    <div class="ld-topo" aria-hidden="true"></div>
    <div class="app" id="app">
      <aside class="side" id="side" aria-label="Menu">
        <div class="brand">
          <img src="../assets/naval-emblema.png" alt="" />
          <div><b>Grupo Naval</b><span id="brand-sub">Portal RTM</span></div>
        </div>
        <a class="back" href="#inicio" id="voltar" hidden
          ><svg viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6" /></svg
          ><span id="voltar-t">Página principal</span></a
        >
        <nav class="nav" id="nav"></nav>
        <div class="side-foot" id="foot">…</div>
        <div class="seg tema-top tema-lado" id="tema" role="group" aria-label="Tema">
          <button type="button" data-t="sistema">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M8 20h8M12 16v4" />
            </svg></button
          ><button type="button" data-t="claro">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg></button
          ><button type="button" data-t="escuro">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
          </button>
        </div>
      </aside>
      <main class="main">
        <header class="barra-sup" id="barra-sup">
          <button class="btn sm menu-btn" id="menu" type="button">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16" /></svg
            ><span id="menu-t">Menu</span>
          </button>
          <button class="procurar" id="procurar" type="button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5" /></svg><span id="procurar-t">Procurar</span
            ><kbd>Ctrl K</kbd>
          </button>
          <div class="estado-sis" id="estado-sis" role="group" aria-label="Estado do sistema">
            <button class="fontes" id="fontes" type="button" aria-expanded="false" aria-controls="fontes-det">
              <span class="l1"><i class="dot" id="fontes-dot"></i><span id="fontes-l1">A verificar as fontes de dados…</span></span>
              <span class="l2" id="fontes-l2"></span>
            </button>
            <div class="fontes-det" id="fontes-det" hidden></div>
            <a class="sync-mini" id="sync-mini" href="#sincronizacao" hidden></a>
          </div>
          <a class="sino" id="sino" href="#alertas" hidden
            ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4" /></svg
            ><span class="sino-n" id="sino-n" hidden></span
          ></a>
          <div class="conta" id="conta" hidden>
            <button class="conta-b" id="conta-b" type="button" aria-expanded="false" aria-controls="conta-p">
              <span class="avatar" id="conta-ini" aria-hidden="true"></span><span class="conta-nome" id="conta-nome"></span
              ><svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
            </button>
            <div class="conta-p" id="conta-p" hidden>
              <div class="quem" id="quem"></div>
              <button class="conta-sair" id="sair" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 16l4-4-4-4M14 12H3" /></svg><span id="sair-t">Terminar sessão</span>
              </button>
            </div>
          </div>
        </header>
        <div class="top">
          <div>
            <button class="fontes-mini" id="fontes-mini" type="button" hidden><i class="dot" id="fontes-mini-dot"></i><span id="fontes-mini-t"></span></button>
            <div class="eyebrow" id="eyebrow" aria-label="Localização"></div>
            <div class="titulo-l">
              <h1 id="titulo">…</h1>
              <button class="fav-b" id="fav" type="button" aria-pressed="false" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z" /></svg>
              </button>
            </div>
            <p class="lead" id="lead"></p>
            <p class="actual" id="actual" aria-live="polite"></p>
          </div>
          <div class="filters">
            <div class="seg" id="presets"></div>
            <label class="date" for="de"
              ><span id="l-de">De</span> <span class="dcampo"><input type="date" id="de" /><span class="dv" id="de-v" aria-hidden="true"></span></span
            ></label>
            <label class="date" for="ate"
              ><span id="l-ate">Até</span> <span class="dcampo"><input type="date" id="ate" /><span class="dv" id="ate-v" aria-hidden="true"></span></span
            ></label>
            <button class="btn ghost" id="xl-page" type="button">
              <svg viewBox="0 0 24 24">
                <path d="M4 4h16v16H4zM4 9h16M9 9v11M8 13l3 4m0-4-3 4" /></svg
              ><span></span>
            </button>
            <button class="btn" id="xl-all" type="button">
              <svg viewBox="0 0 24 24">
                <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" /></svg
              ><span></span>
            </button>
            <button class="btn ghost" id="xl-dados" type="button" hidden>
              <svg viewBox="0 0 24 24">
                <path d="M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" /></svg
              ><span></span>
            </button>
            <div class="seg lang-top" id="lang" role="group" aria-label="Idioma / Language / ቋንቋ">
              <button type="button" data-l="pt">PT</button><button type="button" data-l="en">EN</button
              ><button type="button" data-l="ti" lang="ti" title="ትግርኛ">TI</button>
            </div>
            <div class="filtros2 fb" id="filtros2" role="group" aria-label="Filtros" hidden></div>
          </div>
        </div>
        <div id="page"></div>
      </main>
    </div>
    <div class="toast" id="toast" hidden></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
