# Configuração do Apache gerida pelo Portal RTM (infra-estrutura como código): este ficheiro vem com cada versão do
# portal e é incluído uma única vez no httpd.conf (php ferramentas/actualizar.php apache):
#     Include "C:/Apache24/htdocs/geo/ferramentas/apache/portal-rtm.conf"
# Quando muda, o actualizador valida a configuração (httpd -t), reinicia o Apache e, se falhar, repõe a anterior.
# As regras de cada pasta (segurança, compressão, cache) estão nos .htaccess do portal.

# Módulos de que o portal precisa (só carrega os que ainda não estão carregados)
<IfModule !mime_module>
    LoadModule mime_module modules/mod_mime.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>

# Não revelar a versão do Apache nem do sistema (OWASP, CIS Apache Benchmark)
ServerTokens Prod
ServerSignature Off
TraceEnable Off
