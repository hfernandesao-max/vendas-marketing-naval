# Dependabot: verifica todas as semanas se há versões novas (e correcções de segurança) das dependências
# e abre pedidos de integração com a actualização. Os testes e a verificação de segurança correm em cada
# pedido; as actualizações de correcção (patch) e menores, e as de segurança, são integradas sozinhas quando
# todas as verificações passam (.github/workflows/dependabot-integrar.yml). As maiores ficam para revisão.
# O PHPStan (único pacote do Composer, só de desenvolvimento) tem versão fixa e actualiza-se à mão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    open-pull-requests-limit: 5
    labels: [dependencias]
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    labels: [dependencias]
    groups:
      accoes:
        update-types: [minor, patch]
