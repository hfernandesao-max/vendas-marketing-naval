        if (pode('stock-carrinha') && (DB.cargas || []).some((x) => inR(x.data))) {
          const dias = Object.values(group(DB.cargas.filter((x) => inR(x.data)), 'data')).sort((a, b) => (a[0].data < b[0].data ? -1 : 1)).map((rs) => ({ d: rs[0].data, c: sum(rs, 'carga'), n: rs.length }));
          cards.push(cartaoGrafico({
            titulo: t('Caixas carregadas por dia'), sub: t('{c} caixas em {n} dias, segundo o plano de cargas', { c: n0(sum(dias, 'c')), n: dias.length }), destino: 'stock-carrinha',
            desenhar: (w) => grafColunas(w, { fmt: n0, itens: dias.map((x) => ({ valor: x.c, rot: diaCurto(x.d), titulo: ds(x.d), linhas: [[n0(x.c), t('caixas')], [n0(x.n), t('carrinhas')]] })) }),
            colunas: [[t('Dia')], [t('Caixas'), 1], [t('Carrinhas'), 1]], linhas: dias.map((x) => [dl(x.d), n0(x.c), n0(x.n)]),
          }));
        }
        // 8. Novos clientes por dia (cadastros) com a meta da rede
        if (pode('cadastros-analise') && temCad()) {
          const D = Object.values(group((DB.cad.cadastros_diarios || []).filter((x) => inR(x.dia)), 'dia')).sort((a, b) => (a[0].dia < b[0].dia ? -1 : 1)).map((rs) => ({ d: rs[0].dia, n: sum(rs, 'novos'), r: rs.length }));
          if (D.length) {
            const rotasN = new Set((DB.cad.cadastros_diarios || []).map((x) => x.rota)).size, meta = META_ROTA() * rotasN;
            cards.push(cartaoGrafico({
              titulo: t('Novos clientes por dia'), sub: t('{n} cadastros no período · meta diária da rede {m}', { n: n0(sum(D, 'n')), m: n0(meta) }), destino: 'cadastros-analise',
              desenhar: (w) => grafColunas(w, { fmt: n0, ref: { valor: meta, rot: t('Meta {m}', { m: n0(meta) }) }, itens: D.map((x) => ({ valor: x.n, rot: diaCurto(x.d), titulo: ds(x.d), linhas: [[n0(x.n), t('novos clientes')], [n0(x.r), t('rotas com cadastros')]] })) }),
              colunas: [[t('Dia')], [t('Novos clientes'), 1]], linhas: D.map((x) => [dl(x.d), n0(x.n)]),
            }));
          }
        }
        if (!cards.length) { pg.append(el('div', 'glass empty', t('Sem dados para mostrar no período escolhido.'))); return; }
        const grelha = el('div', 'viz-grid'); grelha.append(...cards); pg.append(grelha);
      }

      R.inicio = (pg) => {
        const V = vendasR(), tot = sum(V, 'total'), liq = sum(V, recebidoDe);
        const din = valorCat(V, 'dinheiro'), mc = valorCat(V, 'multicaixa');
        if (['vendas-promotor', 'documentos', 'pagamentos'].some(podeVer)) pg.append(tiles([
          { l: t('Vendas RTM'), v: kz2(tot), s: t('{n} documentos', { n: n0(V.length) }), cls: 'full-value' },
          { l: t('Recebido'), v: kz2(liq), s: t('{p} do total', { p: pct(tot ? liq / tot : null) }), cls: 'full-value' },
          { l: t('Em dinheiro'), v: temMeio() ? kz2(din) : '—', s: temMeio() ? '' : t('Falta o meio de pagamento'), cls: 'full-value' },
          { l: t('Em Multicaixa'), v: temMeio() ? kz2(mc) : '—', s: temMeio() ? '' : t('Falta o meio de pagamento'), cls: 'full-value' },
          { l: t('Facturas pendentes'), v: kz2(tot - liq), tone: tot - liq > 0 ? 'warn' : null, cls: 'full-value' },
          { l: t('Clientes com compras'), v: n0(new Set(V.map((x) => (isCF(x.nif) ? x.cliente : x.nif))).size) },
        ]));
        painelInicio(pg);
      };

      R['vendas-promotor'] = (pg) => {
        const V = vendasR(), P = porPromotor(V), tot = sum(V, 'total');
        pg.append(tiles([
          { l: t('Vendas RTM'), v: mkz(tot), s: t('{n} documentos', { n: n0(V.length) }) },
          { l: t('Promotores com vendas'), v: n0(P.filter((x) => x.docs > 0).length) },
          { l: t('Venda média por documento'), v: mkz(V.length ? tot / V.length : null) },
          { l: t('Facturas pendentes'), v: mkz(sum(P, 'por_liquidar')), tone: sum(P, 'por_liquidar') > 0 ? 'warn' : null },
        ]));
        pg.append(tabela({
          id: 'vp', titulo: t('Vendas por promotor'), nota: t('Documentos emitidos no Pinguim BO no período.'), rows: P, sort: 'total', total: true,
          cols: [{ key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'clientes', label: t('Clientes'), type: 'n' },
          { key: 'dias', label: t('Dias com vendas'), type: 'n' }, { key: 'total', label: t('Total'), type: 'bar', sum: true }, { key: 'recebido', label: t('Recebido'), type: 'kz', sum: true },
          { key: 'por_liquidar', label: t('Facturas pendentes'), type: 'kz', sum: true }, { key: 'medio', label: t('Média por documento'), type: 'kz' }]
        }));
      };

      R['vendas-dia'] = (pg) => {
        const V = vendasR();
        const dias = Object.values(group(V, 'data')).map((rs) => ({ data: rs[0].data, docs: rs.length, promotores: new Set(rs.map((x) => x.rota)).size, total: sum(rs, 'total'), recebido: sum(rs, recebidoDe) }));
        const secs = el('div', 'secs');
        secs.append(tabela({
          id: 'vd', titulo: t('Vendas por dia'), rows: dias, sort: 'data', total: true, search: false,
          cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'promotores', label: t('Promotores'), type: 'n' },
          { key: 'total', label: t('Total'), type: 'bar', sum: true }, { key: 'recebido', label: t('Recebido'), type: 'kz', sum: true }]
        }));
        const ds2 = [...new Set(V.map((x) => x.data))].sort();
        const mat = Object.values(group(V, 'rota')).map((rs) => { const o = { rota: rs[0].rota, promotor: promotorRota(rs[0].rota), total: sum(rs, 'total') }; ds2.forEach((d) => { o[d] = sum(rs.filter((x) => x.data === d), 'total'); }); return o; });
        secs.append(tabela({
          id: 'vd-mat', titulo: t('Promotor × dia'), rows: mat, sort: 'total', total: true,
          cols: [{ key: 'promotor', label: t('Promotor'), p: 0 }, ...ds2.map((d) => ({ key: d, label: dl(d).slice(0, 5), type: 'kz', sum: true, render: (v) => document.createTextNode(v ? mkz(v) : '—') })), { key: 'total', label: t('Total'), type: 'kz', sum: true }]
        }));
        pg.append(secs);
      };

      R['vendas-cliente'] = (pg) => {
        const V = vendasR();
        const rows = Object.values(group(V, (x) => (isCF(x.nif) ? 'CF|' + x.cliente : x.nif))).map((rs) => ({
          cliente: rs[0].cliente, nif: rs[0].nif, rota: [...new Set(rs.map((x) => x.rota))].join(', '),
          promotor: [...new Set(rs.map((x) => promotorRota(x.rota)))].join(', '), docs: rs.length, total: sum(rs, 'total'), ultima: rs.map((x) => x.data).sort().pop()
        }));
        pg.append(tiles([{ l: t('Clientes com compras'), v: n0(rows.length) }, { l: t('Venda média por cliente'), v: mkz(rows.length ? sum(rows, 'total') / rows.length : null) },
        { l: t('Clientes com mais de uma compra'), v: n0(rows.filter((x) => x.docs > 1).length) }]));
        pg.append(tabela({
          id: 'vc', titulo: t('Vendas por cliente'), rows, sort: 'total', total: true,
          cols: [{ key: 'cliente', label: t('Cliente'), wrap: true }, { key: 'nif', label: t('NIF') }, { key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 },
          { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'total', label: t('Total'), type: 'kz', sum: true }, { key: 'ultima', label: t('Última compra'), type: 'date' }]
        }));
      };

      // Ranking dos melhores clientes e promotores, por valor vendido no período
      R.ranking = (pg) => {
        const V = vendasR(), tot = sum(V, 'total');
        const pos = (rows) => rows.sort((a, b) => b.total - a.total || b.docs - a.docs).map((r, i) => ({ ...r, pos: i + 1, quota: tot ? r.total / tot : null }));
        // Clientes identificados por NIF; o Consumidor Final fica de fora do ranking
        const CL = pos(Object.values(group(V.filter((x) => !isCF(x.nif)), 'nif')).map((rs) => ({
          chave: rs[0].nif, cliente: rs[0].cliente, nif: rs[0].nif, promotor: [...new Set(rs.map((x) => promotorRota(x.rota)))].join(', '),
          docs: rs.length, total: sum(rs, 'total'), medio: sum(rs, 'total') / rs.length, ultima: rs.map((x) => x.data).sort().pop()
        })));
        const PR = pos(Object.values(group(V, 'rota')).map((rs) => ({
          chave: rs[0].rota, promotor: promotorRota(rs[0].rota), docs: rs.length, clientes: new Set(rs.map((x) => (isCF(x.nif) ? x.cliente : x.nif))).size,
          total: sum(rs, 'total'), medio: sum(rs, 'total') / rs.length, recebido: sum(rs, 'total') ? sum(rs, recebidoDe) / sum(rs, 'total') : null
        })));
        const top10 = CL.slice(0, 10), q10 = sum(top10, 'total'), cf = sum(V.filter((x) => isCF(x.nif)), 'total');
        pg.append(tiles([
          { l: t('Melhor promotor'), v: PR[0] ? PR[0].promotor : '—', s: PR[0] ? mkz(PR[0].total) : '', cls: 'nome' },
          { l: t('Melhor cliente'), v: CL[0] ? CL[0].cliente : '—', s: CL[0] ? mkz(CL[0].total) : '', cls: 'nome' },
          { l: t('Peso dos 10 melhores clientes'), v: pct(tot ? q10 / tot : null), s: t('{n} clientes com NIF', { n: n0(CL.length) }) },
          { l: t('Consumidor Final'), v: mkz(cf), s: t('{p} do total', { p: pct(tot ? cf / tot : null) }) },
        ]));
        const posCol = { key: 'pos', label: '#', type: 'n', p: 0, render: (v) => el('b', null, String(v)) };
        pg.append(tabela({
          id: 'rk-prom', titulo: t('Ranking de promotores'), nota: t('Ordenado pelo valor vendido no período, com IVA.'), rows: PR, sort: 'total', total: true, search: false,
          cols: [posCol, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'total', label: t('Total'), type: 'bar', sum: true }, { key: 'quota', label: t('% do total'), type: 'pct' },
          { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'clientes', label: t('Clientes'), type: 'n' }, { key: 'medio', label: t('Média por documento'), type: 'kz' }, { key: 'recebido', label: t('% recebido'), type: 'pct' }]
        }));
        pg.append(tabela({
          id: 'rk-cli', titulo: t('Ranking de clientes'), nota: t('Clientes identificados por NIF, sem Consumidor Final. Ordenado pelo valor comprado no período, com IVA.'), rows: CL, sort: 'total', total: true,
          cols: [posCol, { key: 'cliente', label: t('Cliente'), wrap: true, p: 0 }, { key: 'nif', label: t('NIF') }, { key: 'promotor', label: t('Promotor') }, { key: 'total', label: t('Total'), type: 'bar', sum: true },
          { key: 'quota', label: t('% do total'), type: 'pct' }, { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'medio', label: t('Média por documento'), type: 'kz' }, { key: 'ultima', label: t('Última compra'), type: 'date' }]
        }));
      };

      // Visitas marcadas: cada cliente activo da carteira tem um dia da semana de visita na sua rota.
      // Conta como visitado quando há um documento do Pinguim BO nesse dia, na mesma rota, para esse
      // cliente (pelo código do cliente; sem código, pelo NIF). Só contam dias já terminados desde o
      // arranque do Pinguim BO.
      function visitasPlaneadas() {
        const fim = [st.ate, addD(hoje(), -1)].sort()[0], ini = [st.de, INICIO_PINGUIM].sort()[1], out = [];
        if (ini > fim) return out;
        const act = DB.clientes.filter((x) => x.estado === 'Ativo' && !isCF(x.nif));
        const porDiaRota = group(DB.vendas.filter((x) => x.data >= ini && x.data <= fim), (x) => x.data + '|' + x.rota);
        for (let d = ini; d <= fim; d = addD(d, 1)) {
          const ds3 = diaSemana(d), vistos = new Set();
          act.filter((c) => c.dia === ds3).forEach((c) => {
            const k = c.rota + '|' + c.codigo;
            if (vistos.has(k)) return; vistos.add(k);
            const docs = (porDiaRota[d + '|' + c.rota] || []).filter((x) => (x.cliente_codigo ? String(x.cliente_codigo) === String(c.codigo) : String(x.nif) === String(c.nif)));
            out.push({ data: d, rota: c.rota, codigo: c.codigo, cliente: c.nome, nif: c.nif, visitado: docs.length > 0, total: sum(docs, 'total') });
          });
        }
        return out;
      }

      // Histórico de auditoria: verificações automáticas a cada documento do Pinguim BO, por dia
      function ocorrencias(V) {
        const hj = hoje(), lim = addD(hj, -3), out = [];
        // Possível duplicado: mesma rota, mesmo cliente com NIF, mesmo dia e mesmo valor
        const g = group(V.filter((x) => !isCF(x.nif)), (x) => [x.rota, x.nif, x.data, (+x.total).toFixed(2)].join('|'));
        Object.values(g).filter((rs) => rs.length > 1).forEach((rs) => rs.forEach((x) => out.push({ x, tipo: 'dup', txt: t('Possível duplicado ({n} documentos iguais)', { n: rs.length }) })));
        V.forEach((x) => {
          if (!(+x.total > 0)) out.push({ x, tipo: 'valor', txt: t('Valor nulo ou negativo') });
          if (pendenteDe(x) > 0.005 && x.data < lim) out.push({ x, tipo: 'pend', txt: t('Pendente há mais de 3 dias') });
          if (recebidoDe(x) > 0 && !pagosDe(x).some((p) => p.codigo !== '?')) out.push({ x, tipo: 'meio', txt: t('Pago sem meio de pagamento indicado') });
        });
        return out;
      }
      R.auditoria = (pg) => {
        const V = vendasR(), O = ocorrencias(V), docsCom = new Set(O.map((o) => o.x.chave || o.x.documento));
        const cnt = (tp) => O.filter((o) => o.tipo === tp), dup = cnt('dup'), pend = cnt('pend'), meio = cnt('meio');
        const VP = visitasPlaneadas(), falt = VP.filter((v) => !v.visitado);
        pg.append(tiles([
          { l: t('Documentos verificados'), v: n0(V.length), s: t('{n} com ocorrências', { n: n0(docsCom.size) }), tone: docsCom.size ? 'warn' : null },
          { l: t('Possíveis duplicados'), v: n0(dup.length), s: mkz(sum(dup, (o) => o.x.total)), tone: dup.length ? 'warn' : null },
          { l: t('Pendentes há mais de 3 dias'), v: n0(pend.length), s: mkz(sum(pend, (o) => pendenteDe(o.x))), tone: pend.length ? 'warn' : null },
          { l: t('Pagos sem meio de pagamento'), v: n0(meio.length), s: mkz(sum(meio, (o) => recebidoDe(o.x))), tone: meio.length ? 'warn' : null },
          { l: t('Visitas marcadas não realizadas'), v: n0(falt.length), s: t('{p} das visitas marcadas', { p: pct(VP.length ? falt.length / VP.length : null) }), tone: falt.length ? 'warn' : null },
        ]));
        const gV = group(V, 'data'), gVP = group(VP, 'data');
        const porDia = [...new Set([...Object.keys(gV), ...Object.keys(gVP)])].map((d) => {
          const rs = gV[d] || [], od = O.filter((o) => o.x.data === d), n = (tp) => od.filter((o) => o.tipo === tp).length;
          const vp = gVP[d] || [], nv = vp.filter((v) => !v.visitado).length;
          const com = new Set(od.map((o) => o.x.chave || o.x.documento)).size + nv;
          return { chave: d, data: d, docs: rs.length, total: sum(rs, 'total'), dup: n('dup'), pend: n('pend'), meio: n('meio'), marcadas: vp.length, nao_visitadas: nv, com, estado: com ? t('A rever') : t('Sem ocorrências') };
        });
        pg.append(tabela({
          id: 'au-dia', titulo: t('Histórico por dia'), nota: t('Verificações automáticas a todos os documentos do Pinguim BO no período.'), rows: porDia, sort: 'data', total: true, search: false,
          cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'total', label: t('Total'), type: 'kz', sum: true },
          { key: 'dup', label: t('Possíveis duplicados'), type: 'n', sum: true }, { key: 'pend', label: t('Pendentes há mais de 3 dias'), type: 'n', sum: true }, { key: 'meio', label: t('Pagos sem meio de pagamento'), type: 'n', sum: true },
          { key: 'marcadas', label: t('Visitas marcadas'), type: 'n', sum: true }, { key: 'nao_visitadas', label: t('Visitas não realizadas'), type: 'n', sum: true },
          { key: 'estado', label: t('Estado'), render: (v, r) => pill(v, r.com ? 'p-warn' : 'p-ok'), xl: (r) => r.estado }]
        }));
        const porProm = Object.values(group(VP, 'rota')).map((vs) => {
          const nv = vs.filter((v) => !v.visitado).length;
          return { chave: vs[0].rota, promotor: promotorRota(vs[0].rota), marcadas: vs.length, visitadas: vs.length - nv, nao_visitadas: nv, cumprimento: vs.length ? (vs.length - nv) / vs.length : null };
        });
        pg.append(tabela({
          id: 'au-vis', titulo: t('Visitas marcadas por promotor'), nota: t('Visita realizada = documento do Pinguim BO para o cliente no dia marcado, na mesma rota. Só contam dias já terminados.'), rows: porProm, sort: 'nao_visitadas', total: true, search: false,
          cols: [{ key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'marcadas', label: t('Visitas marcadas'), type: 'n', sum: true }, { key: 'visitadas', label: t('Realizadas'), type: 'n', sum: true },
          { key: 'nao_visitadas', label: t('Visitas não realizadas'), type: 'n', sum: true },
          { key: 'cumprimento', label: t('Cumprimento'), type: 'pct', sum: (rs) => { const a = sum(rs, 'marcadas'); return a ? sum(rs, 'visitadas') / a : null; }, render: (v) => (v == null ? pill('—', 'p-mut') : pill(pct(v), v < 0.5 ? 'p-bad' : v < 0.8 ? 'p-warn' : 'p-ok')) }]
        }));
        pg.append(tabela({
          id: 'au-oc', titulo: t('Ocorrências'), nota: t('Documentos a confirmar com a área comercial ou corrigir no Pinguim BO.'),
          rows: [...O.map((o, i) => ({ chave: (o.x.chave || o.x.documento) + '|' + o.tipo + '|' + i, data: o.x.data, documento: o.x.documento, promotor: promotorRota(o.x.rota), cliente: o.x.cliente, total: +o.x.total || 0, ocorrencia: o.txt })),
            ...falt.map((v) => ({ chave: v.data + '|' + v.rota + '|' + v.codigo + '|visita', data: v.data, documento: '—', promotor: promotorRota(v.rota), cliente: v.cliente + ' (' + v.codigo + ')', total: 0, ocorrencia: t('Visita marcada não realizada (sem venda registada)') }))],
          sort: 'data', total: true,
          cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'documento', label: t('Documento'), nowrap: true }, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'cliente', label: t('Cliente'), wrap: true },
          { key: 'total', label: t('Total'), type: 'kz', sum: true }, { key: 'ocorrencia', label: t('Ocorrência'), wrap: true }]
        }));
      };

      // Filtro de rota nos documentos (fica lembrado neste navegador)
      R.documentos = (pg) => {
        // A rota escolhe-se na barra de filtros; com uma só rota, a página mostra os documentos dessa rota
        const todos = vendasR(), rotaDoc = FV.rota.length === 1 ? FV.rota[0] : '';
        const rotas = [...new Set(todos.map((x) => x.rota))].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b), 'pt', { numeric: true }));
        const porRota = group(todos, 'rota');
        const rotulo = (r) => promotorRota(r);
        const V = todos;
        const tot = sum(V, 'total'), liq = sum(V, recebidoDe), cli = new Set(V.map((x) => (isCF(x.nif) ? x.cliente : x.nif))).size;
        pg.append(tiles([
          { l: rotaDoc ? t('Vendas da rota') : t('Vendas RTM'), v: mkz(tot), s: rotaDoc ? promotorRota(rotaDoc) : t('{n} rotas', { n: rotas.length }) },
          { l: t('Documentos'), v: n0(V.length), s: t('{n} dias com vendas', { n: new Set(V.map((x) => x.data)).size }) },
          { l: t('Recebido'), v: mkz(liq), s: t('{p} do total', { p: pct(tot ? liq / tot : null) }) },
          { l: t('Facturas pendentes'), v: mkz(tot - liq), tone: tot - liq > 0.005 ? 'warn' : null, s: t('{n} documentos', { n: V.filter((x) => pendenteDe(x) > 0).length }) },
          { l: t('Clientes com compras'), v: n0(cli) },
          { l: t('Média por documento'), v: mkz(V.length ? tot / V.length : 0) },
        ]));

        // Resumo por rota (só com todas as rotas)
        if (!rotaDoc) {
          pg.append(tabela({
            id: 'dc-rota', titulo: t('Vendas por rota'), nota: t('Escolha uma rota na barra de filtros para ver só os documentos dessa rota.'), sort: 'total', total: true,

      // ---- Excel no formato habitual (GENERAL SALES PLAN) ----
      const b64 = (buf) => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
      function gerarExcelPlano(rotas, data, versao, artigos) {

          });

      // ---- Importar o Excel feito à mão (transição) ----
      function lerExcelPlano(file) {
        return carregarExcelJS().then(() => file.arrayBuffer()).then((buf) => { const wb = new ExcelJS.Workbook(); return wb.xlsx.load(buf).then(() => wb); }).then((wb) => {
          const ws = wb.worksheets[0]; let hdr = 0;
          ws.eachRow((row, i) => { if (!hdr && row.values.some((v) => typeof v === 'string' && /SALES\s*PERSON/i.test(v))) hdr = i; });
          if (!hdr) throw new Error(t('Não encontrei o cabeçalho do plano (SALES PERSON) no ficheiro.'));
          const val = (row, c) => {
            const cel = row.getCell(c);
            if (cel.isMerged && cel.master && cel.master.address !== cel.address) return null;
            let v = cel.value;
            if (v && typeof v === 'object' && !(v instanceof Date)) v = v.result != null ? v.result : v.text != null ? v.text : v.richText ? v.richText.map((x) => x.text).join('') : null;
            return v;
          };
          const txt = (v) => (v == null || v instanceof Date ? '' : String(v).replace(/\s+/g, ' ').trim());
          const blocos = []; let b = null, dataF = null;
          for (let i = hdr + 1; i <= ws.rowCount; i++) {
            const row = ws.getRow(i), vend = txt(val(row, 2));
            if (vend) {
              b = { vendedor: vend, armazem: txt(val(row, 3)), viagens: +val(row, 5) || 1, zonas: [], itens: [], motorista: txt(val(row, 8)), telefone: txt(val(row, 9)), matricula: txt(val(row, 10)), viatura: txt(val(row, 11)), transportadora: txt(val(row, 12)), factura: txt(val(row, 13)) };
              blocos.push(b);
              const a = val(row, 1); if (a instanceof Date && !dataF) dataF = a.toISOString().slice(0, 10);
            }
            if (!b) continue;
            const z = txt(val(row, 4)); if (z) b.zonas.push(z);
            const it = txt(val(row, 6)); if (it) b.itens.push([it, +val(row, 7) || 0]);
          }
          return { blocos, dataF };
        });
      }
      const titulo = (s) => String(s || '').toLowerCase().replace(/(^|[\s(-])(\p{L})/gu, (m, a, l) => a + l.toUpperCase()).replace(/ (E|De|Do|Da|Dos|Das) /g, (m) => m.toLowerCase());
      // Associa cada bloco do Excel a uma rota: nome do vendedor e, quando não chega, viatura e motorista do histórico
      function rotaDoBloco(b, d, usadas) {
        const kv = chaveTxt(b.vendedor).split(' '), hist = (DB.cargas || []).slice().sort((x, y) => (x.data < y.data ? 1 : -1));
        let melhor = null, pts = 0;
        d.rotas.forEach((rt) => {
          if (usadas.has(rt.rota)) return;
          const kp = chaveTxt(rt.promotor).split(' ');
          let s = 0;
          if (kp.join(' ') === kv.join(' ')) s += 5;
          if (kp[0] && kp[0] === kv[0]) s += 1;
          if (kp.length > 1 && kp[kp.length - 1] === kv[kv.length - 1]) s += 1;
          const hp = hist.find((h) => chaveTxt(h.matricula) === chaveTxt(b.matricula)); if (hp && hp.rota === rt.rota) s += 2;
          const hm = hist.find((h) => chaveTxt(h.motorista) === chaveTxt(b.motorista)); if (hm && hm.rota === rt.rota) s += 2;
          if (s > pts) { pts = s; melhor = rt; }
        });
        return pts >= 2 ? melhor : null;
      }
      function importarExcelPlano(file) {
        lerExcelPlano(file).then(({ blocos, dataF }) => {
          if (!blocos.length) { toast(t('O ficheiro não tem rotas.'), 6000); return; }
          const alvo = dataF || PC.data;
          const passo = alvo !== PC.data ? guardarPlano().then(() => carregarPlano(alvo)) : Promise.resolve();
          return passo.then(() => {
            const d = PC.resp, arts = d.listas.artigos, usadas = new Set(), falhas = [];
            const L = d.listas, achar = (lista, v) => lista.find((x) => chaveTxt(x) === chaveTxt(v)) || titulo(v);
            PC.rotas.forEach((r) => { r.sai = false; });
            blocos.forEach((b) => {
              const rt = rotaDoBloco(b, d, usadas);
              if (!rt) { falhas.push(b.vendedor); return; }
              usadas.add(rt.rota);
              const r = PC.rotas.find((x) => x.rota === rt.rota);
              const q = {}; arts.forEach((a) => { q[a.id] = 0; });
              b.itens.forEach(([nome, v]) => { const a = arts.find((x) => chaveTxt(x.nome) === chaveTxt(nome)); if (a) q[a.id] += v; });

                viatura: b.viatura ? achar(L.viaturas, b.viatura) : '', transportadora: b.transportadora ? achar(L.transportadoras, b.transportadora) : '', factura: b.factura,

        },
        marcar(id, est, det) {
          const li = $('#ld-' + id); if (!li) return;
          li.className = est; li.querySelector('.st').textContent = est === 'feito' ? '✓' : est === 'aviso' ? '!' : '';
          if (det != null) li.querySelector('.det').textContent = det;
          this.estado[id] = est;
          const feitos = this.passos.filter(([k]) => ['feito', 'aviso'].includes(this.estado[k])).length;
          $('#ld-barra').style.width = Math.max(8, Math.round(feitos / this.passos.length * 100)) + '%';
          const prox = this.passos.find(([k]) => !['feito', 'aviso'].includes(this.estado[k]));
          if (est !== 'activo' && prox && this.estado[prox[0]] !== 'activo') { this.marcar(prox[0], 'activo'); return; }
          $('#ld-sub').textContent = prox ? t(prox[1]) + '…' : t('Pronto');
        },
        fechar() { setTimeout(() => { $('#loader').classList.add('fora'); setTimeout(() => { $('#loader').hidden = true; }, 600); }, 350); },
      };
      LD.iniciar();
      // Segurança: se algo falhar sem resposta, o ecrã de carregamento sai ao fim de 45 s
      const ldLimite = setTimeout(() => LD.fechar(), 45000);

      // Sessão (perfil, rotas e permissões); 401 = sessão terminada, volta ao login
      const lerSessao = () => fetch('data/sessao.php', { cache: 'no-store' }).then((r) => {
        if (r.status === 401) { location.href = '../geo/login.php?redirect=' + encodeURIComponent('../reports/'); throw new Error('sessao'); }
        return r.text();
      }).then((tx) => { try { const d = JSON.parse(tx); SESSAO = d && d.permissoes ? d : null; } catch (e) { SESSAO = null; } }).catch((e) => { if (e.message === 'sessao') throw e; });
      // Ficheiros de dados: pelo serviço PHP (filtrado pelo perfil); sem PHP (teste local), o .json directo
      const lerDados = (id) => fetch('data/dados.php?f=' + id, { cache: 'no-store' }).then((r) => r.text()).then((tx) => {
        try { const d = JSON.parse(tx); return Array.isArray(d) ? d : []; }
        catch (e) { return fetch('data/' + id + '.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : [])).catch(() => []); }
      }).catch(() => []);
      lerSessao()
        .then(() => Promise.all(['rotas', 'clientes', 'cargas'].map((id) => lerDados(id).then((d) => { DB[id] = d; }))))
        .then(() => {
          ['rotas', 'clientes', 'cargas'].forEach((k) => { if (!Array.isArray(DB[k])) DB[k] = []; });
          LD.marcar('base', DB.rotas.length ? 'feito' : 'aviso', t('{n} rotas', { n: DB.rotas.length }));
          DB.vendas = [];
          DB.mapRota = Object.fromEntries(DB.rotas.map((x) => [x.rota, x]));
          // Cadastros (rtm-clientes): no servidor via PHP; em alternativa, o ficheiro JSON copiado para data/
          const ler = (u) => fetch(u, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
          return ler('data/cadastros.php').then((d) => (d && d.cadastros ? d : ler('data/cadastros.json'))).then((d) => {
            DB.cad = d && Array.isArray(d.cadastros) ? d : null;
            // A carteira mais recente (com o dia de visita) substitui a lista fixa de clientes.json
            if (DB.cad && Array.isArray(DB.cad.carteira) && DB.cad.carteira.length) DB.clientes = DB.cad.carteira;
            avaliarFontes();
            LD.marcar('cad', DB.cad ? 'feito' : 'aviso', DB.cad ? n0(DB.cad.cadastros.length) + ' ' + t('clientes') : t('sem ligação'));
          });
        })
        .then(() => {
          carregarFiltro();
          return (st.preset || !st.de || !st.ate ? aplicarPreset(st.preset || 'mes') : fetchVendas(st.de, st.ate))
            .then(() => LD.marcar('vendas', LIGACOES.pinguim.estado === 'ok' ? 'feito' : 'aviso', LIGACOES.pinguim.estado === 'ok' ? t('{n} documentos', { n: n0(DB.vendas.length) }) : t('sem ligação')));
        })
        .then(() => {
          if (!diasTodos.length) $('#titulo').textContent = t('Sem dados');
          else route();
          LD.marcar('pronto', 'feito'); clearTimeout(ldLimite); LD.fechar();
        })
        .catch((e) => { console.error(e); clearTimeout(ldLimite); LD.fechar(); });
    })();
  </script>
</body>

</html>
