# Endereço curto dos códigos QR das etiquetas: id.naval.co.ao (no Apache do servidor do portal ou noutro servidor web).
# Requisitos (pedido ao departamento de TI): registo DNS público id.naval.co.ao, certificado TLS válido para esse nome,
# portas 80 e 443 abertas na firewall para a Internet. Copiar esta pasta para C:\Apache24\conf\naval\, ajustar os
# caminhos do certificado e acrescentar ao httpd.conf:  Include conf/naval/id-naval.conf
# Módulos: ssl_module, rewrite_module, headers_module, socache_shmcb_module.
Listen 443

<VirtualHost *:80>
    ServerName id.naval.co.ao
    RewriteEngine On
    RewriteRule "^/(.*)$" "https://id.naval.co.ao/$1" [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName id.naval.co.ao
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    # Certificado de id.naval.co.ao (ou *.naval.co.ao) emitido por uma autoridade reconhecida pelos telemóveis
    SSLCertificateFile    "C:/Apache24/conf/ssl/id.naval.co.ao.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/ssl/id.naval.co.ao.key"
    SSLCertificateChainFile "C:/Apache24/conf/ssl/id.naval.co.ao-cadeia.crt"
    Header always set Strict-Transport-Security "max-age=31536000"
    DocumentRoot "C:/Apache24/htdocs/id-naval-vazio"
    Include conf/naval/id-naval-regras.conf
</VirtualHost>
