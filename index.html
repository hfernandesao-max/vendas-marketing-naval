<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal RTM · Grupo Naval</title>
<meta name="description" content="Portal RTM do Grupo Naval Angola: vendas do Pinguim BO por promotor, dia e cliente, recebimentos, carga das carrinhas e carteira de clientes.">
<link rel="icon" type="image/png" href="assets/globo.png">
<style>
/* Estilo do Portal do Grupo: azul-marinho escuro, menu lateral, cartões de vidro com ícone em azul */
:root{
  color-scheme:dark;
  --bg:#08122B; --bg2:#0C1A3D; --side:#0B1735; --side2:#0E1E45;
  --card:rgba(20,36,80,.55); --card2:rgba(26,46,100,.55); --line:rgba(140,170,230,.14); --line2:rgba(140,170,230,.24);
  --fg:#F2F5FC; --muted:#8FA3C8; --dim:#6B7FA6;
  --accent:#3F8CFF; --accent2:#2A6FE0; --sky:#6EC3FF; --navy:#1E4FB0;
  --ok:#3DD68C; --warn:#F5B547; --bad:#FF6B6B;
  --r:18px; --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 70% -10%,#13285C 0%,var(--bg) 55%) fixed,var(--bg);color:var(--fg);font:14px/1.45 var(--font);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}

/* menu lateral */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--side2),var(--side));border-right:1px solid var(--line);
  padding:22px 14px max(22px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:2px 10px 14px}
.brand img{width:44px;height:36px;object-fit:contain}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.navg{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:10px 12px 3px}
.nav a{display:flex;align-items:center;gap:11px;padding:7px 12px;border-radius:11px;color:#DCE4F5;text-decoration:none;font-size:13.5px;line-height:1.3;margin:1px 0}
.nav a svg{width:19px;height:19px;flex:none;stroke:#BFD0EE;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(63,140,255,.08)}
.nav a.on{background:linear-gradient(90deg,rgba(63,140,255,.26),rgba(63,140,255,.10));color:#fff;box-shadow:inset 0 0 0 1px rgba(110,195,255,.18)}
.nav a.on svg{stroke:#fff}
.nav a .n{margin-left:auto;font-size:11px;font-weight:700;color:var(--warn);background:rgba(245,181,71,.14);border-radius:999px;padding:1px 8px}
.side-foot{margin-top:10px;padding:10px 12px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}

/* área principal */
.main{min-width:0;padding-block:28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:600}
h1{margin:6px 0 0;font-size:clamp(26px,3.2vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.lead{color:var(--muted);margin:8px 0 0;max-width:70ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:9px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:rgba(63,140,255,.22);color:#fff}
.date{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.date input{background:transparent;border:0;color:var(--fg);font-size:12.5px;padding:3px 0;color-scheme:dark}
.btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid rgba(110,195,255,.35);background:linear-gradient(145deg,rgba(63,140,255,.32),rgba(42,111,224,.22));
  color:#fff;border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:600}
.btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.menu-btn{display:none}
.side-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:0 12px}
.side-tools .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.btn.ghost{background:rgba(255,255,255,.04);border-color:var(--line)}
.btn[disabled]{opacity:.6;cursor:progress}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:40;background:#132654;border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45)}

/* cartões */
.glass{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 40px -26px rgba(0,0,0,.6)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px;margin-bottom:18px}
.tile{padding:16px 18px;display:grid;gap:4px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.tile .s{font-size:12px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.card-link{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px;min-height:206px;text-decoration:none;color:inherit;transition:transform .18s,border-color .18s}
.card-link:hover{transform:translateY(-2px);border-color:var(--line2)}
.ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#3C8BF0,#1E4FB0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -8px rgba(30,79,176,.9);margin-bottom:auto}
.ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.alt{background:linear-gradient(145deg,#5B6BD8,#33409E)}
.card-link .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-weight:600;margin-top:20px}
.card-link .t{font-size:20px;font-weight:750;letter-spacing:-.01em}
.card-link .d{font-size:13px;color:var(--muted)}
.badge{position:absolute;top:18px;right:18px;font-size:12px;font-weight:700;color:var(--warn);background:rgba(245,181,71,.13);border:1px solid rgba(245,181,71,.25);border-radius:999px;padding:4px 11px}
.badge.ok{color:var(--ok);background:rgba(61,214,140,.12);border-color:rgba(61,214,140,.25)}
.badge.bad{color:var(--bad);background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.28)}
.secs{display:grid;gap:18px}
.sec{padding:18px 18px 12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.sec-h h2{margin:0;font-size:16.5px;font-weight:700}
.sec-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted);max-width:80ch}
.sec-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;width:min(100%,220px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}

/* tabelas */
.tw{overflow-x:auto;border-radius:12px}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:#2A3C6E transparent}
table.compact th,table.compact td{padding:6px 7px;font-size:12px}
table.compact td.t{white-space:normal;min-width:72px}
table.compact td.w{min-width:120px}
.more{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px 2px;font-size:12px;color:var(--muted)}
.more div{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{all:unset;cursor:pointer;color:var(--sky);font-weight:600;font-size:12px}
.linkbtn:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:#12224C;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th button{all:unset;cursor:pointer}
td.n,th.n{text-align:right}
td.w{white-space:normal;min-width:180px}
tbody tr:hover td{background:rgba(63,140,255,.07)}
tfoot td{background:#132654;font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.p-ok{color:var(--ok);background:rgba(61,214,140,.12)}.p-warn{color:var(--warn);background:rgba(245,181,71,.13)}.p-bad{color:var(--bad);background:rgba(255,107,107,.13)}.p-mut{color:var(--muted);background:rgba(143,163,200,.12)}
.cbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.cbar i{display:block;height:6px;border-radius:6px;background:linear-gradient(90deg,#2A6FE0,#6EC3FF);min-width:2px}
.heat td.h{text-align:right;min-width:74px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--warn);background:rgba(245,181,71,.13);vertical-align:3px}

/* gráficos simples */
.bars{display:grid;gap:8px}
.bars .r{display:grid;grid-template-columns:minmax(120px,32%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bars .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#DCE4F5}
.bars .tr{height:10px;border-radius:10px;background:rgba(255,255,255,.05);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#1E4FB0,#3F8CFF 60%,#6EC3FF)}
.mix{display:flex;height:14px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);margin:6px 0 10px}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.note{font-size:12px;color:var(--dim);margin:8px 2px 0}

@media (max-height:820px) and (min-width:961px){
  .side{padding-top:14px;padding-bottom:10px}
  .brand{padding-bottom:8px}.brand img{width:36px;height:30px}
  .navg{padding:6px 12px 1px}
  .nav a{padding:5px 12px;font-size:13px}
  .nav a svg{width:17px;height:17px}
  .side-tools{margin-top:6px}.side-foot{margin-top:6px;padding:6px 12px;font-size:11px}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:30;transform:translateX(-105%);transition:transform .25s;height:100%}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .menu-btn{display:inline-flex;margin-bottom:12px}
  .tile .v{font-size:20px}
  .main{padding-top:max(18px,env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu">
    <div class="brand"><img src="assets/globo.png" alt=""><div><b>Grupo Naval Angola</b><span id="brand-sub">Portal RTM</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-tools"><span class="lbl" id="lang-lbl">Idioma</span><div class="seg" id="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="pt">PT</button><button type="button" data-l="en">EN</button></div></div>
    <div class="side-foot" id="foot">…</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <button class="btn sm menu-btn" id="menu" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menu-t">Menu</span></button>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="titulo">…</h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="filters">
        <div class="seg" id="presets"></div>
        <label class="date" for="de"><span id="l-de">De</span> <input type="date" id="de"></label>
        <label class="date" for="ate"><span id="l-ate">Até</span> <input type="date" id="ate"></label>
        <button class="btn ghost" id="xl-page" type="button"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 9v11M8 13l3 4m0-4-3 4"/></svg><span></span></button>
        <button class="btn" id="xl-all" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><span></span></button>
      </div>
    </div>
    <div id="page"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

    pg.append(tabela({ id: 'vc', titulo: t('Vendas por cliente'), rows, sort: 'total', total: true,
      cols: [{ key: 'cliente', label: t('Cliente'), wrap: true }, { key: 'nif', label: t('NIF') }, { key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 },
        { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'total', label: t('Total'), type: 'kz', sum: true }, { key: 'ultima', label: t('Última compra'), type: 'date' }] }));
  };

  R.documentos = (pg) => {
    pg.append(tabela({ id: 'dc', titulo: t('Documentos Pinguim'), rows: vendasR().map((x) => ({ ...x, promotor: nomeRota(x.rota) })), sort: 'data', total: true,
      cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'hora', label: t('Hora') }, { key: 'documento', label: t('Documento'), nowrap: true }, { key: 'tipo', label: t('Tipo') }, { key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 },
        { key: 'cliente', label: t('Cliente'), wrap: true }, { key: 'nif', label: t('NIF') }, { key: 'meio_pagamento', label: t('Meio de pagamento') },
        { key: 'liquidado', label: t('Pago'), render: (v) => pill(t(v ? 'Sim' : 'Não'), v ? 'p-ok' : 'p-warn'), xl: (r) => t(r.liquidado ? 'Sim' : 'Não') },
        { key: 'total', label: t('Total'), type: 'kz', sum: true }] }));
  };

  R.pagamentos = (pg) => {
    const V = vendasR(), tot = sum(V, 'total'), liq = sum(V.filter((x) => x.liquidado), 'total');
    const M = { dinheiro: 0, multicaixa: 0, transferencia: 0, outro: 0 }; V.filter((x) => x.liquidado).forEach((x) => { const m = meioDe(x); if (m) M[m] += x.total; });
    pg.append(tiles([
      { l: t('Recebido'), v: mkz(liq), s: t('{p} do total', { p: pct(tot ? liq / tot : null) }) },
      { l: t('Em dinheiro'), v: temMeio() ? mkz(M.dinheiro) : '—', s: temMeio() ? t('{p} do recebido', { p: pct(liq ? M.dinheiro / liq : null) }) : t('Falta o meio de pagamento') },
      { l: t('Em Multicaixa'), v: temMeio() ? mkz(M.multicaixa) : '—', s: temMeio() ? t('{p} do recebido', { p: pct(liq ? M.multicaixa / liq : null) }) : t('Falta o meio de pagamento') },
      { l: t('Por liquidar'), v: mkz(tot - liq), tone: tot - liq > 0 ? 'warn' : null, s: t('{n} documentos', { n: V.filter((x) => !x.liquidado).length }) },
    ]));
    const secs = el('div', 'secs');
    if (!temMeio()) {
      const box = el('div');
      box.append(el('p', null, t('A exportação de vendas do Pinguim BO que temos indica só se cada documento está liquidado. Para separar o que foi recebido em dinheiro e em Multicaixa, a exportação tem de trazer o meio de pagamento de cada documento (ou o mapa de recebimentos do Pinguim BO).')));
      const ul = el('ul'); ul.style.color = 'var(--muted)'; ul.style.lineHeight = '1.8';
      ['Documento', 'Data', 'Rota', 'Meio de pagamento (dinheiro, Multicaixa, transferência)', 'Valor recebido'].forEach((c) => ul.append(el('li', null, t(c))));
      box.append(ul);
      secs.append(secBox(t('Falta o meio de pagamento'), t('Assim que a exportação incluir esta coluna, os valores aparecem aqui sem mais alterações.'), box));
    }
    const pp = Object.values(group(V, 'rota')).map((rs) => { const o = { rota: rs[0].rota, promotor: nomeRota(rs[0].rota), total: sum(rs, 'total') }; const lq = rs.filter((x) => x.liquidado);
      o.recebido = sum(lq, 'total'); o.dinheiro = temMeio() ? sum(lq.filter((x) => meioDe(x) === 'dinheiro'), 'total') : null; o.multicaixa = temMeio() ? sum(lq.filter((x) => meioDe(x) === 'multicaixa'), 'total') : null; o.por_liquidar = o.total - o.recebido; return o; });
    const cols = (k) => [{ key: k, label: t(k === 'data' ? 'Dia' : 'Promotor'), type: k === 'data' ? 'date' : undefined }, { key: 'total', label: t('Total'), type: 'kz', sum: true }, { key: 'recebido', label: t('Recebido'), type: 'kz', sum: true },
      { key: 'dinheiro', label: t('Dinheiro'), type: 'kz', sum: temMeio() }, { key: 'multicaixa', label: t('Multicaixa'), type: 'kz', sum: temMeio() }, { key: 'por_liquidar', label: t('Por liquidar'), type: 'kz', sum: true }];
    secs.append(tabela({ id: 'pg-prom', titulo: t('Por promotor'), rows: pp, sort: 'total', total: true, cols: cols('promotor') }));
    const pd = Object.values(group(V, 'data')).map((rs) => { const lq = rs.filter((x) => x.liquidado); return { data: rs[0].data, total: sum(rs, 'total'), recebido: sum(lq, 'total'),
      dinheiro: temMeio() ? sum(lq.filter((x) => meioDe(x) === 'dinheiro'), 'total') : null, multicaixa: temMeio() ? sum(lq.filter((x) => meioDe(x) === 'multicaixa'), 'total') : null, por_liquidar: sum(rs, 'total') - sum(lq, 'total') }; });
    secs.append(tabela({ id: 'pg-dia', titulo: t('Por dia'), rows: pd, sort: 'data', total: true, search: false, cols: cols('data') }));
    secs.append(tabela({ id: 'pg-pend', titulo: t('Documentos por liquidar'), rows: V.filter((x) => !x.liquidado).map((x) => ({ ...x, promotor: nomeRota(x.rota) })), sort: 'total', total: true, search: false,
      cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'documento', label: t('Documento'), nowrap: true }, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'cliente', label: t('Cliente'), wrap: true }, { key: 'total', label: t('Total'), type: 'kz', sum: true }] }));
    pg.append(secs);
  };

  R['stock-carrinha'] = (pg) => {
    const C = DB.cargas.filter((x) => inR(x.data));
    pg.append(tiles([{ l: t('Carrinhas'), v: n0(new Set(C.map((x) => x.matricula)).size) }, { l: t('Caixas carregadas'), v: n0(sum(C, 'carga')) },
      { l: t('Fraldas'), v: n0(sum(C, 'carga_fraldas')) }, { l: t('Sabão'), v: n0(sum(C, 'carga_sabao')) }, { l: t('Sabonetes'), v: n0(sum(C, 'carga_sabonete')) }]));
    const secs = el('div', 'secs');
    secs.append(tabela({ id: 'sc', titulo: t('Carga por promotor e carrinha'), nota: t('Caixas carregadas em cada carrinha segundo o plano de cargas diário. O stock por artigo de cada carrinha fica disponível com a exportação de stock do Pinguim BO.'), rows: C, sort: 'data', total: true,
      cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'matricula', label: t('Carrinha') }, { key: 'viatura', label: t('Viatura') }, { key: 'motorista', label: t('Motorista') },
        { key: 'n_zonas', label: t('Zonas'), type: 'n' }, { key: 'carga_fraldas', label: t('Fraldas'), type: 'n', sum: true }, { key: 'carga_sabao', label: t('Sabão'), type: 'n', sum: true }, { key: 'carga_sabonete', label: t('Sabonetes'), type: 'n', sum: true },
        { key: 'carga', label: t('Total'), type: 'n', sum: true }, { key: 'zonas', label: t('Zonas de descarga'), wrap: true }] }));
    pg.append(secs);
  };
  R['stock-armazem'] = (pg) => aguardar(pg, t('Para mostrar o stock por armazém e por carrinha, a exportação de stock do Pinguim BO deve trazer:'), ['Armazém ou carrinha', 'Artigo (código e descrição)', 'Stock inicial, entradas, saídas e stock final', 'Data']);
  R['vendas-artigo'] = (pg) => aguardar(pg, t('Para mostrar vendas por artigo, com e sem IVA e com desconto, a exportação de linhas de venda do Pinguim BO deve trazer:'), ['Documento, data e rota', 'Artigo (código, descrição e marca)', 'Quantidade e preço unitário', 'Desconto', 'Valor sem IVA, IVA e valor com IVA']);
  R['vendas-marca'] = (pg) => aguardar(pg, t('Para mostrar vendas por promotor e marca, a exportação de linhas de venda do Pinguim BO deve trazer:'), ['Documento, data e rota', 'Artigo e marca', 'Quantidade', 'Valor sem IVA e com IVA', 'Desconto']);

  R.clientes = (pg) => {
    const C = DB.clientes;
    const uni = Object.values(group(C, (x) => x.rota + '|' + (isCF(x.nif) ? 'CF|' + (x.codigo || x.nome) : x.nif))).map((rs) => ({ ...rs[0], dias: [...new Set(rs.map((x) => nomeDia(x.dia)))].join(', ') }));
    const comprou = new Set(DB.vendas.filter((x) => inR(x.data)).map((x) => x.rota + '|' + x.nif));
    const rows = uni.map((x) => ({ rota: x.rota, promotor: nomeRota(x.rota), codigo: x.codigo, nome: x.nome, nif: x.nif, tipo: x.tipo, dias: x.dias, estado: x.estado, gps: x.tem_gps, comprou: !isCF(x.nif) && comprou.has(x.rota + '|' + x.nif) }));
    const reais = rows.filter((x) => !isCF(x.nif));
    pg.append(tiles([{ l: t('Clientes na carteira'), v: n0(reais.length), s: t('sem Consumidor Final') }, { l: t('Activos'), v: n0(reais.filter((x) => x.estado === 'Ativo').length) },
      { l: t('Pendentes ou com erro'), v: n0(rows.filter((x) => x.estado !== 'Ativo').length), tone: 'warn' }, { l: t('Sem GPS'), v: n0(reais.filter((x) => !x.gps).length) },
      { l: t('Compraram no período'), v: n0(reais.filter((x) => x.comprou).length), s: t('{p} da carteira', { p: pct(reais.length ? reais.filter((x) => x.comprou).length / reais.length : null) }) }]));
    const pr = Object.values(group(rows, 'rota')).map((rs) => { const r2 = rs.filter((x) => !isCF(x.nif)); return { rota: rs[0].rota, promotor: nomeRota(rs[0].rota), clientes: r2.length, activos: r2.filter((x) => x.estado === 'Ativo').length,
      pendentes: rs.filter((x) => x.estado !== 'Ativo').length, sem_gps: r2.filter((x) => !x.gps).length, compraram: r2.filter((x) => x.comprou).length, cobertura: r2.length ? r2.filter((x) => x.comprou).length / r2.length : null }; });
    const secs = el('div', 'secs');
    secs.append(tabela({ id: 'cl-r', titulo: t('Carteira por rota'), nota: t('Cobertura = clientes da carteira que compraram no período.'), rows: pr, sort: 'rota', dir: 1, total: true,
      cols: [{ key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'clientes', label: t('Clientes'), type: 'n', sum: true }, { key: 'activos', label: t('Activos'), type: 'n', sum: true },
        { key: 'pendentes', label: t('Pendentes / erro'), type: 'n', sum: true }, { key: 'sem_gps', label: t('Sem GPS'), type: 'n', sum: true }, { key: 'compraram', label: t('Compraram'), type: 'n', sum: true },
        { key: 'cobertura', label: t('Cobertura'), type: 'pct', sum: (rs) => { const a = sum(rs, 'clientes'); return a ? sum(rs, 'compraram') / a : null; } }] }));
    secs.append(tabela({ id: 'cl-d', titulo: t('Clientes'), rows, sort: 'nome', dir: 1,
      cols: [{ key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 }, { key: 'codigo', label: t('Código') }, { key: 'nome', label: t('Cliente'), wrap: true }, { key: 'nif', label: t('NIF') },
        { key: 'tipo', label: t('Tipo') }, { key: 'dias', label: t('Dias de visita') }, { key: 'estado', label: t('Estado'), render: (v) => pill(t(v), v === 'Ativo' ? 'p-ok' : v === 'Erro' ? 'p-bad' : 'p-warn'), xl: (r) => t(r.estado) },
        { key: 'comprou', label: t('Comprou no período'), render: (v) => pill(t(v ? 'Sim' : 'Não'), v ? 'p-ok' : 'p-mut'), xl: (r) => t(r.comprou ? 'Sim' : 'Não') }] }));
    pg.append(secs);
  };

  R['plano-visitas'] = (pg) => {
    const dias = [...new Set(DB.vendas.map((x) => x.data))].filter(inR).sort();
    const act = DB.clientes.filter((x) => x.estado === 'Ativo' && !isCF(x.nif));
    const rows = [];
    dias.forEach((d) => {
      const ds3 = diaSemana(d), V = DB.vendas.filter((x) => x.data === d);
      Object.keys(DB.mapRota).forEach((r) => {
        const plan = new Set(act.filter((x) => x.rota === r && x.dia === ds3).map((x) => x.nif));
        const vr = V.filter((x) => x.rota === r), comp = new Set(vr.filter((x) => !isCF(x.nif)).map((x) => x.nif));
        const ok = [...comp].filter((n) => plan.has(n)).length;
        if (!plan.size && !vr.length) return;
        rows.push({ chave: d + '|' + r, data: d, dia: nomeDia(ds3), rota: r, promotor: nomeRota(r), planeados: plan.size, compraram: ok, fora: comp.size - ok, docs: vr.length, total: sum(vr, 'total'), cumprimento: plan.size ? ok / plan.size : null });
      });
    });
    pg.append(tiles([{ l: t('Clientes planeados'), v: n0(sum(rows, 'planeados')) }, { l: t('Planeados que compraram'), v: n0(sum(rows, 'compraram')) },
      { l: t('Cumprimento'), v: pct(sum(rows, 'planeados') ? sum(rows, 'compraram') / sum(rows, 'planeados') : null), tone: 'warn' }, { l: t('Vendas fora do plano'), v: n0(sum(rows, 'fora')), s: t('clientes de outro dia ou rota') }]));
    pg.append(tabela({ id: 'pv', titulo: t('Plano de visitas por dia e rota'), nota: t('Planeados = clientes activos da carteira com visita nesse dia da semana. Cumprimento = planeados que compraram.'), rows, sort: 'data', total: true,
      cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'dia', label: t('Dia da semana') }, { key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 },
        { key: 'planeados', label: t('Planeados'), type: 'n', sum: true }, { key: 'compraram', label: t('Compraram'), type: 'n', sum: true }, { key: 'fora', label: t('Fora do plano'), type: 'n', sum: true },
        { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'total', label: t('Total'), type: 'kz', sum: true },
        { key: 'cumprimento', label: t('Cumprimento'), type: 'pct', sum: (rs) => { const a = sum(rs, 'planeados'); return a ? sum(rs, 'compraram') / a : null; }, render: (v) => (v == null ? pill('—', 'p-mut') : pill(pct(v), v < 0.2 ? 'p-bad' : v < 0.5 ? 'p-warn' : 'p-ok')) }] }));
  };

  // ================= desenho =================
  function textos() {
    document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
    $('#brand-sub').textContent = t('Portal RTM'); $('#lang-lbl').textContent = t('Idioma'); $('#menu-t').textContent = t('Menu');
    $('#l-de').textContent = t('De'); $('#l-ate').textContent = t('Até');
    $('#xl-page span').textContent = t('Excel desta página'); $('#xl-all span').textContent = t('Excel completo');
    document.querySelectorAll('#lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === LANG));
    if (diasSap.length) $('#foot').textContent = t('Vendas Pinguim BO até {a}', { a: dl(diasSap[diasSap.length - 1]) });
  }
  function draw() {
    const p = paginaAtual();
    REG = { tabelas: [], kpis: [] }; FITS = [];
    textos();
    $('#de').value = st.de; $('#ate').value = st.ate;
    const ps = presets(), seg = $('#presets'); seg.replaceChildren();
    Object.entries(ps).forEach(([k, v]) => { const b = el('button', st.preset === k && st.de === v[1] && st.ate === v[2] ? 'on' : null, t(v[0])); b.type = 'button'; b.addEventListener('click', () => setPreset(k)); seg.append(b); });
    $('#eyebrow').textContent = t(p.grupo || 'Portal RTM') + ' · ' + (st.de === st.ate ? ds(st.de) : `${dl(st.de)} – ${dl(st.ate)}`);
    $('#titulo').textContent = p.id === 'inicio' ? t('Onde pretende entrar?') : t(p.nome);
    $('#lead').textContent = p.id === 'inicio' ? t('Vendas, recebimentos, stock e carteira de clientes da equipa RTM, a partir do Pinguim BO e do plano de cargas.') : '';
    const pg = $('#page'); pg.replaceChildren();
    try { R[p.id](pg); } catch (e) { console.error(e); pg.append(el('div', 'glass empty', t('Não foi possível desenhar esta página.'))); }
    nav();
    requestAnimationFrame(() => FITS.forEach((f) => f()));
    document.title = (p.id === 'inicio' ? t('Portal RTM') : t(p.nome)) + ' · Grupo Naval';
  }
  function route() { const h = location.hash.slice(1); atual = PAGES.some((x) => x.id === h) ? h : 'inicio'; draw(); window.scrollTo(0, 0); }

  $('#xl-page').addEventListener('click', () => {
    const p = paginaAtual();
    if (p.id === 'inicio') { $('#xl-all').click(); return; }
    exportarExcel([{ pagina: p.nome, grupo: p.grupo, kpis: REG.kpis, tabelas: REG.tabelas }], t(p.nome));
  });
  $('#xl-all').addEventListener('click', () => {
    const pags = PAGES.filter((p) => p.id !== 'inicio').map((p) => { const r = recolher(p.id); return { pagina: p.nome, grupo: p.grupo, kpis: r.kpis, tabelas: r.tabelas }; });
    const ini = recolher('inicio'); pags.unshift({ pagina: 'Início', grupo: null, kpis: ini.kpis, tabelas: [] });
    exportarExcel(pags, t('Relatório completo'));
  });
  document.querySelectorAll('#lang button').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.l; try { localStorage.setItem('vm-lang', LANG); } catch (e) {} setFmt(); draw(); }));
  const onDate = () => { const a = $('#de').value, b = $('#ate').value; if (a && b && a <= b) { st.de = a; st.ate = b; st.preset = null; guardar(); draw(); } };
  $('#de').addEventListener('change', onDate); $('#ate').addEventListener('change', onDate);
  $('#menu').addEventListener('click', () => $('#app').classList.toggle('open'));
  addEventListener('hashchange', route);
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => FITS.forEach((f) => f()), 150); });

  Promise.all(FONTES.map((id) => fetch('data/' + id + '.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : [])).catch(() => []).then((d) => { DB[id] = d; })))
    .then(() => {
      FONTES.forEach((k) => { if (!Array.isArray(DB[k])) DB[k] = []; });
      DB.mapRota = Object.fromEntries(DB.rotas.map((x) => [x.rota, x]));
      diasSap = [...new Set(DB.vendas.map((x) => x.data))].sort();
      diasTodos = [...new Set([...diasSap, ...DB.cargas.map((x) => x.data)])].sort();
      if (!diasTodos.length) { $('#titulo').textContent = t('Sem dados'); return; }
      carregarFiltro();
      if (!st.de || !st.ate || st.de > diasTodos[diasTodos.length - 1]) { const p = presets().mes; st.de = p[1]; st.ate = p[2]; st.preset = 'mes'; }
      else if (st.preset) { const p = presets()[st.preset]; if (p) { st.de = p[1]; st.ate = p[2]; } }
      route();
    });
})();
</script>
</body>
</html>
