<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal RTM · Grupo Naval</title>
  <meta name="description"
    content="Portal RTM do Grupo Naval Angola: vendas do Pinguim BO por promotor, dia e cliente, recebimentos, carga das carrinhas e carteira de clientes.">
  <link rel="icon" type="image/png" href="../assets/globo.png">
  <style>
    /* Estilo do Portal do Grupo: azul-marinho escuro, menu lateral, cartões de vidro com ícone em azul */
    :root {
      color-scheme: dark;
      --bg: #08122B;
      --bg2: #0C1A3D;
      --side: #0B1735;
      --side2: #0E1E45;
      --card: rgba(20, 36, 80, .55);
      --card2: rgba(26, 46, 100, .55);
      --line: rgba(140, 170, 230, .14);
      --line2: rgba(140, 170, 230, .24);
      --fg: #F2F5FC;
      --muted: #8FA3C8;
      --dim: #6B7FA6;
      --accent: #3F8CFF;
      --accent2: #2A6FE0;
      --sky: #6EC3FF;
      --navy: #1E4FB0;
      --ok: #3DD68C;
      --warn: #F5B547;
      --bad: #FF6B6B;
      --r: 18px;
      --font: "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      background: radial-gradient(120% 80% at 70% -10%, #13285C 0%, var(--bg) 55%) fixed, var(--bg);
      color: var(--fg);
      font: 14px/1.45 var(--font);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--sky);
      outline-offset: 2px;
      border-radius: 6px
    }

    .app {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
      min-height: 100%
    }

    /* menu lateral */
    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: linear-gradient(180deg, var(--side2), var(--side));
      border-right: 1px solid var(--line);
      padding: 22px 14px max(22px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px))
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 10px 14px
    }

    .brand img {
      width: 44px;
      height: 36px;
      object-fit: contain
    }

    .brand b {
      display: block;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .brand span {
      display: block;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 1px
    }

    .navg {
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 10px 12px 3px
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 12px;
      border-radius: 11px;
      color: #DCE4F5;
      text-decoration: none;
      font-size: 13.5px;
      line-height: 1.3;
      margin: 1px 0
    }

    .nav a svg {
      width: 19px;
      height: 19px;
      flex: none;
      stroke: #BFD0EE;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .nav a:hover {
      background: rgba(63, 140, 255, .08)
    }

    .nav a.on {
      background: linear-gradient(90deg, rgba(63, 140, 255, .26), rgba(63, 140, 255, .10));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(110, 195, 255, .18)
    }

    .nav a.on svg {
      stroke: #fff
    }

    .nav a .n {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--warn);
      background: rgba(245, 181, 71, .14);
      border-radius: 999px;
      padding: 1px 8px
    }

    .side-foot {
      margin-top: 10px;
      padding: 10px 12px;
      font-size: 11.5px;
      color: var(--dim);
      border-top: 1px solid var(--line)
    }

    /* área principal */
    .main {
      min-width: 0;
      padding-block: 28px 40px;
      padding-left: max(28px, env(safe-area-inset-left, 0px));
      padding-right: max(28px, env(safe-area-inset-right, 0px))
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 22px
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--sky);
      font-weight: 600
    }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(26px, 3.2vw, 38px);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
      text-wrap: balance
    }

    .lead {
      color: var(--muted);
      margin: 8px 0 0;
      max-width: 70ch
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center
    }

    .seg {
      display: inline-flex;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 3px
    }

    .seg button {
      all: unset;
      cursor: pointer;
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .seg button.on {
      background: rgba(63, 140, 255, .22);
      color: #fff
    }

    .date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .date input {
      background: transparent;
      border: 0;
      color: var(--fg);
      font-size: 12.5px;
      padding: 3px 0;
      color-scheme: dark
    }

    /* A data é sempre mostrada como dia-mês-ano, seja qual for o idioma do navegador:
       o texto do campo nativo fica invisível e por cima aparece a data formatada */
    .date .campo {
      position: relative;
      display: inline-flex;
      align-items: center
    }

    .date .campo input {
      color: transparent;
      cursor: pointer
    }

    .date .campo input::-webkit-datetime-edit {
      color: transparent
    }

    .date .dv {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fg);
      font-size: 12.5px;
      pointer-events: none;
      font-variant-numeric: tabular-nums
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      border: 1px solid rgba(110, 195, 255, .35);
      background: linear-gradient(145deg, rgba(63, 140, 255, .32), rgba(42, 111, 224, .22));
      color: #fff;
      border-radius: 12px;
      padding: 8px 13px;
      font-size: 12.5px;
      font-weight: 600
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 10px
    }

    .menu-btn {
      display: none
    }

    .back {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 10px 8px;
      padding: 6px 10px;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 12.5px;
      border: 1px solid var(--line)
    }

    .back:hover {
      color: #fff;
      background: rgba(63, 140, 255, .08)
    }

    .back svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    /* terminar sessão (mesma acção dos botões "Terminar sessão" do GEO) */
    .sair {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 10px 0;
      padding: 9px 12px;
      border-radius: 10px;
      color: #FCA5A5;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid rgba(252, 165, 165, .25);
      background: rgba(252, 165, 165, .06)
    }

    .sair:hover {
      background: rgba(252, 165, 165, .14);
      color: #FECACA
    }

    .sair svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .side-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding: 0 12px
    }

    .side-tools .lbl {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim)
    }

    .btn.ghost {
      background: rgba(255, 255, 255, .04);
      border-color: var(--line)
    }

    .btn[disabled] {
      opacity: .6;
      cursor: progress
    }

    .toast {
      position: fixed;
      right: max(18px, env(safe-area-inset-right, 0px));
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      z-index: 40;
      background: #132654;
      border: 1px solid var(--line2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .45)
    }

    /* cartões */
    .glass {
      background: linear-gradient(160deg, var(--card2), var(--card));
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 18px 40px -26px rgba(0, 0, 0, .6)
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr));
      gap: 14px;
      margin-bottom: 18px
    }

    .tile {
      padding: 16px 18px;
      display: grid;
      gap: 4px
    }

    .tile .l {
      font-size: 12px;
      color: var(--muted)
    }

    .tile .v {
      font-size: 24px;
      font-weight: 750;
      letter-spacing: -.02em;
      white-space: nowrap
    }

    .tile.full-value .v {
      font-size: clamp(16px, 1.55vw, 21px);
      letter-spacing: -.03em
    }

    /* quadro com um nome em vez de um número (ranking) */
    .tile.nome {
      min-width: 0
    }

    .tile.nome .v {
      font-size: 18px;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.25
    }

        .tile .s {
      font-size: 12px;
      color: var(--dim)
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
      gap: 16px
    }

    .card-link {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 22px;
      min-height: 206px;
      text-decoration: none;
      color: inherit;
      transition: transform .18s, border-color .18s
    }

    .card-link:hover {
      transform: translateY(-2px);
      border-color: var(--line2)
    }

    .ico {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #3C8BF0, #1E4FB0);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 8px 18px -8px rgba(30, 79, 176, .9);
      margin-bottom: auto
    }

    .ico svg {
      width: 24px;
      height: 24px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ico.alt {
      background: linear-gradient(145deg, #5B6BD8, #33409E)
    }

    .card-link .k {
      font-size: 11.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--sky);
      font-weight: 600;
      margin-top: 20px
    }

    .card-link .t {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.01em
    }

    .card-link .d {
      font-size: 13px;
      color: var(--muted)
    }

    .badge {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--warn);
      background: rgba(245, 181, 71, .13);
      border: 1px solid rgba(245, 181, 71, .25);
      border-radius: 999px;
      padding: 4px 11px
    }

    .badge.ok {
      color: var(--ok);
      background: rgba(61, 214, 140, .12);
      border-color: rgba(61, 214, 140, .25)
    }

    .badge.bad {
      color: var(--bad);
      background: rgba(255, 107, 107, .12);
      border-color: rgba(255, 107, 107, .28)
    }

    .secs {
      display: grid;
      gap: 18px
    }

    .sec {
      padding: 18px 18px 12px;
      min-width: 0
    }

    .sec-h {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px
    }

    .sec-h h2 {
      margin: 0;
      font-size: 16.5px;
      font-weight: 700
    }

    .sec-h p {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
      max-width: 80ch
    }

    .sec-tools {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .search {
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12.5px;
      width: min(100%, 220px)
    }

    /* filtro de rota nos documentos */
    .filtro {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 16px;
      margin-bottom: 14px
    }

    .filtro label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .filtro select {
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13px;
      min-width: 0;
      width: min(100%, 340px)
    }

    .filtro select option {
      background: var(--side, #0B1735);
      color: var(--fg)
    }

    .filtro .limpar {
      all: unset;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--sky);
      padding: 4px 6px;
      border-radius: 6px
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
      gap: 18px
    }

    /* tabelas */
    .tw {
      overflow-x: auto;
      border-radius: 12px
    }

    [hidden] {
      display: none !important
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #2A3C6E transparent
    }

    table.compact th,
    table.compact td {
      padding: 6px 7px;
      font-size: 12px
    }

    table.compact td.t {
      white-space: normal;
      min-width: 72px
    }

    table.compact td.w {
      min-width: 120px
    }

    .more {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 4px 2px;
      font-size: 12px;
      color: var(--muted)
    }

    .more div {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .linkbtn {
      all: unset;
      cursor: pointer;
      color: var(--sky);
      font-weight: 600;
      font-size: 12px
    }

    .linkbtn:focus-visible {
      outline: 2px solid var(--sky);
      outline-offset: 2px;
      border-radius: 4px
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px
    }

    th,
    td {
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--line)
    }

    th {
      background: #12224C;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      font-weight: 600
    }

    th button {
      all: unset;
      cursor: pointer
    }

    td.n,
    th.n {
      text-align: right
    }

    td.w {
      white-space: normal;
      min-width: 180px
    }

    tbody tr:hover td {
      background: rgba(63, 140, 255, .07)
    }

    tfoot td {
      background: #132654;
      font-weight: 700;
      border-top: 1px solid var(--line2);
      border-bottom: 0
    }

    .empty {
      padding: 26px;
      text-align: center;
      color: var(--muted);
      font-size: 13px
    }

    .pill {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700
    }

    .p-ok {
      color: var(--ok);
      background: rgba(61, 214, 140, .12)
    }

    .p-warn {
      color: var(--warn);
      background: rgba(245, 181, 71, .13)
    }

    .p-bad {
      color: var(--bad);
      background: rgba(255, 107, 107, .13)
    }

    .p-mut {
      color: var(--muted);
      background: rgba(143, 163, 200, .12)
    }

    .cbar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      width: 100%
    }

    .cbar i {
      display: block;
      height: 6px;
      border-radius: 6px;
      background: linear-gradient(90deg, #2A6FE0, #6EC3FF);
      min-width: 2px
    }

    .heat td.h {
      text-align: right;
      min-width: 74px
    }

    .chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      color: var(--warn);
      background: rgba(245, 181, 71, .13);
      vertical-align: 3px
    }

    /* gráficos simples */
    .bars {
      display: grid;
      gap: 8px
    }

    .bars .r {
      display: grid;
      grid-template-columns: minmax(120px, 32%) 1fr auto;
      gap: 10px;
      align-items: center;
      font-size: 12.5px
    }

    .bars .r span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #DCE4F5
    }

    .bars .tr {
      height: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      overflow: hidden
    }

    .bars .tr i {
      display: block;
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #1E4FB0, #3F8CFF 60%, #6EC3FF)
    }

    .mix {
      display: flex;
      height: 14px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, .05);
      margin: 6px 0 10px
    }

    .mix i {
      display: block;
      height: 100%
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 12px;
      color: var(--muted)
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: 0
    }

    .note {
      font-size: 12px;
      color: var(--dim);
      margin: 8px 2px 0
    }

    @media (max-height:820px) and (min-width:961px) {
      .side {
        padding-top: 14px;
        padding-bottom: 10px
      }

      .brand {
        padding-bottom: 8px
      }

      .brand img {
        width: 36px;
        height: 30px
      }

      .navg {
        padding: 6px 12px 1px
      }

      .nav a {
        padding: 5px 12px;
        font-size: 13px
      }

      .nav a svg {
        width: 17px;
        height: 17px
      }

      .side-tools {
        margin-top: 6px
      }

      .side-foot {
        margin-top: 6px;
        padding: 6px 12px;
        font-size: 11px
      }
    }

    @media (max-width:960px) {
      .app {
        grid-template-columns: 1fr
      }

      .side {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 300px);
        z-index: 30;
        transform: translateX(-105%);
        transition: transform .25s;
        height: 100%
      }

      .app.open .side {
        transform: none;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5)
      }

      .menu-btn {
        display: inline-flex;
        margin-bottom: 12px
      }

      .tile .v {
        font-size: 20px
      }

      .main {
        padding-top: max(18px, env(safe-area-inset-top, 0px))
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Menu">
      <div class="brand"><img src="../assets/globo.png" alt="">
        <div><b>Grupo Naval</b><span id="brand-sub">Portal RTM</span></div>

      function pagosDe(x) {
        if (Array.isArray(x.pagamentos)) return x.pagamentos;
        if (!x.liquidado) return [];
        return [{ codigo: x.meio_pagamento ? '' : '?', meio: x.meio_pagamento || 'Sem meio indicado', valor: +x.total || 0 }];
      }
      const recebidoDe = (x) => (x.valor_pago != null ? +x.valor_pago || 0 : (x.liquidado ? +x.total || 0 : 0));
      const pendenteDe = (x) => Math.max(0, (+x.total || 0) - recebidoDe(x));
      const temMeio = () => DB.vendas.some((x) => pagosDe(x).some((p) => p.codigo !== '?'));
      // Agrupa cada meio em dinheiro, Multicaixa, transferência ou outro, pelo código e depois pelo nome
      function catMeio(p) {
        const c = String(p.codigo || '').toUpperCase(), m = String(p.meio || '').toUpperCase();
        if (c === 'NU' || /NUMER|DINHEIRO|CASH/.test(m)) return 'dinheiro';
        if (c === 'MC' || /MULTI|TPA|CART|CARD/.test(m)) return 'multicaixa';
        if (c === 'TB' || /TRANSF/.test(m)) return 'transferencia';

            const ok = [...comp].filter((n) => plan.has(n)).length;
            if (!plan.size && !vr.length) return;
            rows.push({ chave: d + '|' + r, data: d, dia: nomeDia(ds3), rota: r, promotor: promotorRota(r), planeados: plan.size, compraram: ok, fora: comp.size - ok, docs: vr.length, total: sum(vr, 'total'), cumprimento: plan.size ? ok / plan.size : null });
          });
        });
        pg.append(tiles([{ l: t('Clientes planeados'), v: n0(sum(rows, 'planeados')) }, { l: t('Planeados que compraram'), v: n0(sum(rows, 'compraram')) },
        { l: t('Cumprimento'), v: pct(sum(rows, 'planeados') ? sum(rows, 'compraram') / sum(rows, 'planeados') : null), tone: 'warn' }, { l: t('Vendas fora do plano'), v: n0(sum(rows, 'fora')), s: t('clientes de outro dia ou rota') }]));
        pg.append(tabela({
          id: 'pv', titulo: t('Plano de visitas por dia e rota'), nota: t('Planeados = clientes activos da carteira com visita nesse dia da semana. Cumprimento = planeados que compraram.'), rows, sort: 'data', total: true,
          cols: [{ key: 'data', label: t('Dia'), type: 'date' }, { key: 'dia', label: t('Dia da semana') }, { key: 'rota', label: t('Rota'), p: 4 }, { key: 'promotor', label: t('Promotor'), p: 0 },
          { key: 'planeados', label: t('Planeados'), type: 'n', sum: true }, { key: 'compraram', label: t('Compraram'), type: 'n', sum: true }, { key: 'fora', label: t('Fora do plano'), type: 'n', sum: true },
          { key: 'docs', label: t('Documentos'), type: 'n', sum: true }, { key: 'total', label: t('Total'), type: 'kz', sum: true },
          { key: 'cumprimento', label: t('Cumprimento'), type: 'pct', sum: (rs) => { const a = sum(rs, 'planeados'); return a ? sum(rs, 'compraram') / a : null; }, render: (v) => (v == null ? pill('—', 'p-mut') : pill(pct(v), v < 0.2 ? 'p-bad' : v < 0.5 ? 'p-warn' : 'p-ok')) }]
        }));
      };

      // ================= desenho =================
      function textos() {
        document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
        $('#brand-sub').textContent = t('Portal RTM'); $('#voltar-t').textContent = t('Página principal'); $('#sair-t').textContent = t('Sair'); $('#sair').title = t('Terminar sessão'); $('#lang-lbl').textContent = t('Idioma'); $('#menu-t').textContent = t('Menu');
        $('#l-de').textContent = t('De'); $('#l-ate').textContent = t('Até');
        $('#xl-page span').textContent = t('Excel desta página'); $('#xl-all span').textContent = t('Excel completo');
        document.querySelectorAll('#lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === LANG));
        if (diasSap.length) $('#foot').textContent = t('Vendas Pinguim BO até {a}', { a: dl(diasSap[diasSap.length - 1]) });
      }
      function draw() {
        const p = paginaAtual();
        REG = { tabelas: [], kpis: [] }; FITS = [];
        textos();
        $('#de').value = st.de; $('#ate').value = st.ate; $('#de-v').textContent = dl(st.de); $('#ate-v').textContent = dl(st.ate);
        const ps = presets(), seg = $('#presets'); seg.replaceChildren();
        Object.entries(ps).forEach(([k, v]) => { const b = el('button', st.preset === k ? 'on' : null, t(v[0])); b.type = 'button'; b.addEventListener('click', () => setPreset(k)); seg.append(b); });
        $('#eyebrow').textContent = t(p.grupo || 'Portal RTM') + ' · ' + (st.de === st.ate ? ds(st.de) : `${dl(st.de)} – ${dl(st.ate)}`);
        $('#titulo').textContent = p.id === 'inicio' ? t('Onde pretende entrar?') : t(p.nome);
        $('#lead').textContent = p.id === 'inicio' ? t('Vendas, recebimentos, stock e carteira de clientes da equipa RTM, a partir do Pinguim BO e do plano de cargas.') : '';
        const pg = $('#page'); pg.replaceChildren();
        try { R[p.id](pg); } catch (e) { console.error(e); pg.append(el('div', 'glass empty', t('Não foi possível desenhar esta página.'))); }
        nav();
        requestAnimationFrame(() => FITS.forEach((f) => f()));
        document.title = (p.id === 'inicio' ? t('Portal RTM') : t(p.nome)) + ' · Grupo Naval';
      }
      function route() {
        const h = location.hash.slice(1);
        // Atalho da página principal ("Exportações Excel"): abre o início e gera o Excel completo
        if (h === 'exportar') { history.replaceState(null, '', '#inicio'); atual = 'inicio'; draw(); setTimeout(() => $('#xl-all').click(), 300); return; }
        atual = PAGES.some((x) => x.id === h) ? h : 'inicio'; draw(); window.scrollTo(0, 0);
      }

      $('#xl-page').addEventListener('click', () => {
        const p = paginaAtual();
        if (p.id === 'inicio') { $('#xl-all').click(); return; }
        exportarExcel([{ pagina: p.nome, grupo: p.grupo, kpis: REG.kpis, tabelas: REG.tabelas }], t(p.nome));
      });
      $('#xl-all').addEventListener('click', () => {
        const pags = PAGES.filter((p) => p.id !== 'inicio').map((p) => { const r = recolher(p.id); return { pagina: p.nome, grupo: p.grupo, kpis: r.kpis, tabelas: r.tabelas }; });
        const ini = recolher('inicio'); pags.unshift({ pagina: 'Início', grupo: null, kpis: ini.kpis, tabelas: [] });
        exportarExcel(pags, t('Relatório completo'));
      });
      document.querySelectorAll('#lang button').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.l; try { localStorage.setItem('vm-lang', LANG); } catch (e) { } setFmt(); draw(); }));
      const onDate = () => { const a = $('#de').value, b = $('#ate').value; if (a && b && a <= b) { st.de = a; st.ate = b; st.preset = null; guardar(); fetchVendas(a, b).then(() => draw()); } };
      $('#de').addEventListener('change', onDate); $('#ate').addEventListener('change', onDate);
      // Abre o calendário ao clicar e mantém a data visível em dia-mês-ano enquanto se escolhe
      ['de', 'ate'].forEach((id) => {
        const i = $('#' + id);
        i.addEventListener('click', () => { try { i.showPicker(); } catch (e) { } });
        i.addEventListener('input', () => { $('#' + id + '-v').textContent = dl(i.value); });
      });
      $('#menu').addEventListener('click', () => $('#app').classList.toggle('open'));
      addEventListener('hashchange', route);
      let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => FITS.forEach((f) => f()), 150); });

      Promise.all(['rotas', 'clientes', 'cargas'].map((id) => fetch('data/' + id + '.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : [])).catch(() => []).then((d) => { DB[id] = d; })))
        .then(() => {
          ['rotas', 'clientes', 'cargas'].forEach((k) => { if (!Array.isArray(DB[k])) DB[k] = []; });
          DB.vendas = [];
          DB.mapRota = Object.fromEntries(DB.rotas.map((x) => [x.rota, x]));
          carregarFiltro();
          if (st.preset || !st.de || !st.ate) return aplicarPreset(st.preset || 'mes');
          return fetchVendas(st.de, st.ate);
        })
        .then(() => {
          if (!diasTodos.length) { $('#titulo').textContent = t('Sem dados'); return; }
          route();
        });
    })();
  </script>
</body>

</html>
