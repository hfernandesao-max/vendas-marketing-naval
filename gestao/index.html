<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RTM Gestão</title>
    <meta name="description" content="App de gestão do Grupo Naval: vendas do dia, rotas, alertas e assistente." />
    <link rel="icon" type="image/png" href="../assets/naval-emblema-64.png" />
    <meta name="theme-color" content="#273777" />
    <link rel="apple-touch-icon" sizes="180x180" href="../app/icones/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="RTM Gestão" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <script src="../app/registar.js" defer></script>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="../reports/js/app-gestao.js"></script>
  </head>

  <body>
    <header class="ag-topo">
      <button type="button" id="ag-menu-b" class="ag-icone ag-menu-b" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="ag-gaveta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <img src="../assets/naval-emblema-64.png" alt="" width="28" height="28" />
      <div class="ag-titulo"><strong>RTM Gestão</strong><span id="ag-estado">…</span></div>
      <button type="button" id="ag-actualizar" class="ag-icone" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
      </button>
    </header>
    <div id="ag-puxar" class="ag-puxar" aria-live="polite"></div>
    <h1 id="ag-h1" class="ag-h1">Hoje</h1>
    <main id="ag-conteudo" class="ag-conteudo" aria-live="polite">
      <p class="ag-vazio">A carregar…</p>
    </main>
    <dialog id="ag-gaveta" class="ag-gaveta" aria-labelledby="ag-gaveta-t">
      <div class="ag-gaveta-cab">
        <img src="../assets/naval-emblema-64.png" alt="" width="28" height="28" />
        <div class="ag-titulo"><strong id="ag-gaveta-t">RTM Gestão</strong><span id="ag-gaveta-conta"></span></div>
        <button type="button" id="ag-gaveta-fechar" class="ag-icone" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <nav class="ag-menu" id="ag-separadores" aria-label="Secções"></nav>
      <div class="ag-gaveta-pe" id="ag-gaveta-pe"></div>
    </dialog>
  </body>
</html>
