# Configuração do Apache gerida pelo Portal RTM (infra-estrutura como código): este ficheiro vem com cada versão do
# portal e é incluído uma única vez no httpd.conf (php ferramentas/actualizar.php apache):
#     Include "C:/Apache24/htdocs/geo/ferramentas/apache/portal-rtm.conf"
# Quando muda, o actualizador valida a configuração (httpd -t), reinicia o Apache e, se falhar, repõe a anterior.
# As regras de cada pasta (segurança, compressão, cache) estão nos .htaccess do portal.

# Módulos de que o portal precisa (só carrega os que ainda não estão carregados)
<IfModule !mime_module>
    LoadModule mime_module modules/mod_mime.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>

# Não revelar a versão do Apache nem do sistema (OWASP, CIS Apache Benchmark)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ── Capacidade (dezenas a centenas de pessoas ao mesmo tempo) ──────────────────────────────────────────────────────
# Ligações persistentes: o navegador e a app reutilizam a ligação (sem novo aperto de mão TLS a cada pedido).
# Fecham ao fim de 5 s sem pedidos, para não prenderem fios de execução.
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5
Timeout 120
# Windows (mpm_winnt): um processo com N fios de execução; cada pedido em curso ocupa um fio. Os 64 de origem
# esgotam-se com ~50 pessoas (cada página faz vários pedidos em paralelo); 600 dá margem para ~1000 pessoas.
<IfModule mpm_winnt_module>
    ThreadLimit 1920
    ThreadsPerChild 600
    MaxConnectionsPerChild 0
    # Recomendação da Apache Lounge para Windows: sem filtros de aceitação nem sendfile (evita ligações presas)
    AcceptFilter http none
    AcceptFilter https none
    EnableSendfile Off
    EnableMMAP Off
</IfModule>
# HTTP/2 (quando o módulo existe nesta instalação do Apache): vários pedidos na mesma ligação, cabeçalhos comprimidos
# — o que mais acelera o portal e a app na rede móvel. Sem o módulo, fica tudo como está (HTTP/1.1).
<IfFile "modules/mod_http2.so">
    <IfModule !http2_module>
        LoadModule http2_module modules/mod_http2.so
    </IfModule>
</IfFile>
<IfModule http2_module>
    Protocols h2 http/1.1
    H2MaxSessionStreams 100
</IfModule>
