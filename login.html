<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrada GeoMobilidade Naval</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/globo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
<style>
/* Entrada: um único cartão de vidro centrado sobre o mesmo fundo azul-noite da página principal */
:root{
  color-scheme:dark;
  --bg:#070D1C; --bg2:#0B1530; --card:rgba(24,34,62,.62); --card2:rgba(30,44,80,.55);
  --line:rgba(160,185,235,.13); --line2:rgba(160,185,235,.24);
  --fg:#F4F7FD; --muted:#A3AEC4; --dim:#6E7A93; --field:#0C1428;
  --cyan:#38B6F0; --blue:#4D8DFF; --bad:#FF7A7A;
  --font:"Poppins","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 50% at 18% 12%,rgba(30,90,170,.20),transparent 70%),
    radial-gradient(50% 45% at 85% 70%,rgba(40,80,200,.16),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg) 60%) fixed,var(--bg);
  min-height:100vh;display:grid;place-items:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.lang{position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.lang button{all:unset;cursor:pointer;padding:5px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.lang button.on{background:rgba(77,141,255,.22);color:#fff}
.lang button:focus-visible{outline:2px solid var(--cyan)}

.card{width:100%;max-width:400px;padding:34px 30px 26px;border-radius:22px;
  background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 30px 60px -30px rgba(0,0,0,.85);backdrop-filter:blur(8px)}
.logo{display:block;width:132px;height:auto;margin:0 auto}
h1{margin:20px 0 0;text-align:center;font-size:25px;letter-spacing:-.015em;line-height:1.2}
h1 b{font-weight:800}h1 span{font-weight:300;color:#D5DEEF}
.mod{margin:8px 0 0;text-align:center;font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
form{display:grid;gap:18px;margin-top:28px}
label{display:block;font-size:13.5px;color:#C7D0E0;margin-bottom:8px}
.f{position:relative}
.f svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
input{width:100%;height:50px;padding:0 44px 0 44px;border-radius:12px;border:1px solid var(--line2);background:var(--field);color:var(--fg);font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--dim)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,141,255,.22)}
.eye{all:unset;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:9px;cursor:pointer}
.eye svg{position:static;transform:none}
.eye:hover svg{stroke:var(--fg)}
.eye:focus-visible{outline:2px solid var(--cyan)}
.err{min-height:20px;margin:-6px 0 -8px;font-size:13px;color:var(--bad)}
.go{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:12px;cursor:pointer;
  font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,#1F5BE8,#2E6BFF 55%,#2558E0);box-shadow:0 14px 30px -14px rgba(20,120,230,.9);transition:filter .2s}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.go[disabled]{opacity:.6;cursor:wait}
.go svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;font-size:14px;color:#C7D0E0;text-decoration:none}
.back:hover{color:#fff}
.back svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:12px;line-height:1.6;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="pt">PT</button><button type="button" data-l="en">EN</button></div>

<main class="card">
  <img class="logo" src="assets/logo-naval.png" alt="Naval">
  <h1><b>GeoMobilidade</b><span>Naval</span></h1>
  <div class="mod" id="mod" hidden></div>

  <form id="form" novalidate>
    <div>
      <label for="utilizador" data-t="Utilizador">Utilizador</label>
      <div class="f">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>
        <input id="utilizador" name="utilizador" autocomplete="username" autocapitalize="none" spellcheck="false" data-ph="Insira o seu utilizador" placeholder="Insira o seu utilizador" required>
      </div>
    </div>
    <div>
      <label for="senha" data-t="Palavra-passe">Palavra-passe</label>
      <div class="f">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v10H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
        <input id="senha" name="senha" type="password" autocomplete="current-password" data-ph="Insira a sua palavra-passe" placeholder="Insira a sua palavra-passe" required>
        <button type="button" class="eye" id="ver" aria-label="Mostrar palavra-passe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg></button>
      </div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="entrar" type="submit"><span data-t="Entrar">Entrar</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
  </form>

  <a class="back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg><span data-t="Voltar à página inicial">Voltar à página inicial</span></a>
  <div class="foot" data-t="© 2026 GeoMobilidade Naval · Todos os direitos reservados">© 2026 GeoMobilidade Naval · Todos os direitos reservados</div>
</main>

<script>
(() => {
  // Contas de acesso: utilizador -> SHA-256 de "geomobilidade:<utilizador>:<palavra-passe>".
  // Nota: num site estático isto só controla a entrada; não protege os ficheiros de dados.
  const CONTAS = {
    'naval': '9d63845c4ae31fa0f31c8ec1c7fed739f360f8b9fe2f691960a8ef9b48cb817e',
  };
  // Módulos que esta entrada pode abrir (o destino vem de login.html#reports ou login.html#geo)
  const MODULOS = { reports: { url: 'reports/index.html', nome: 'Reports' }, geo: { url: '', nome: 'GEO' } };

  const EN = {
    'Utilizador': 'Username', 'Palavra-passe': 'Password', 'Insira o seu utilizador': 'Enter your username', 'Insira a sua palavra-passe': 'Enter your password',
    'Entrar': 'Sign in', 'Voltar à página inicial': 'Back to home page', '© 2026 GeoMobilidade Naval · Todos os direitos reservados': '© 2026 GeoMobilidade Naval · All rights reserved',
    'Preencha o utilizador e a palavra-passe.': 'Enter your username and password.', 'Utilizador ou palavra-passe incorrectos.': 'Incorrect username or password.',
    'O módulo GEO ainda não tem endereço configurado.': 'The GEO module does not have an address configured yet.', 'Módulo': 'Module',
    'Mostrar palavra-passe': 'Show password', 'Esconder palavra-passe': 'Hide password',
  };
  const store = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } };
  let LANG = 'pt'; try { LANG = localStorage.getItem('vm-lang') === 'en' ? 'en' : 'pt'; } catch (e) {}
  const t = (s) => (LANG === 'en' && EN[s] ? EN[s] : s);

  let m = 'reports';
  const q = (location.hash || '').slice(1) || new URLSearchParams(location.search).get('m');
  if (q && MODULOS[q]) m = q;
  const destino = MODULOS[m];

  const $ = (s) => document.querySelector(s);
  function aplicar() {
    document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
    document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = t(e.dataset.t); });
    document.querySelectorAll('[data-ph]').forEach((e) => { e.placeholder = t(e.dataset.ph); });
    document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === LANG));
    $('#mod').textContent = t('Módulo') + ' ' + destino.nome; $('#mod').hidden = false;
    $('#ver').setAttribute('aria-label', t($('#senha').type === 'password' ? 'Mostrar palavra-passe' : 'Esconder palavra-passe'));
  }
  document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.l; try { localStorage.setItem('vm-lang', LANG); } catch (e) {} aplicar(); }));
  $('#ver').addEventListener('click', () => { const s = $('#senha'); s.type = s.type === 'password' ? 'text' : 'password'; aplicar(); s.focus(); });

  async function sha256(txt) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
  }
  $('#form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const u = $('#utilizador').value.trim().toLowerCase(), p = $('#senha').value, err = $('#err');
    err.textContent = '';
    if (!u || !p) { err.textContent = t('Preencha o utilizador e a palavra-passe.'); return; }
    $('#entrar').disabled = true;
    const ok = CONTAS[u] && (await sha256('geomobilidade:' + u + ':' + p)) === CONTAS[u];
    $('#entrar').disabled = false;
    if (!ok) { err.textContent = t('Utilizador ou palavra-passe incorrectos.'); $('#senha').select(); return; }
    store('gm-sessao', JSON.stringify({ u, em: Date.now() }));
    if (!destino.url) { err.textContent = t('O módulo GEO ainda não tem endereço configurado.'); return; }
    location.href = destino.url;
  });
  aplicar();
  $('#utilizador').focus();
})();
</script>
</body>
</html>
