# Regras do endereço curto dos códigos QR das etiquetas (incluídas por id-naval.conf; testadas em tests/apache).
#   https://id.naval.co.ao/a/NAV-SMT-0001  →  302  →  https://geo.naval.co.ao:2051/equipamentos/ficha.php?id=NAV-SMT-0001
# 302 (e não 301): os telemóveis não guardam o destino, que pode mudar (por exemplo, o portal passar para a porta 443)
# sem trocar nenhuma etiqueta. Qualquer outro endereço responde 404, sem revelar nada.
RewriteEngine On
RewriteRule "^/a/([A-Za-z]{3}-[A-Za-z]{3}-[0-9]{4})/?$" "https://geo.naval.co.ao:2051/equipamentos/ficha.php?id=$1" [R=302,L,NE]
RewriteRule "^/(robots\.txt)$" - [L]
RewriteRule "^" - [R=404,L]
Header always set Cache-Control "no-store"
Header always set X-Robots-Tag "noindex, nofollow"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
