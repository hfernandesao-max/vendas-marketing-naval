<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendas Marketing · Grupo Naval</title>
<meta name="description" content="Portal de vendas e stock da Marketing do Grupo Naval Angola: stock por promotor e armazém, vendas por artigo, marca e promotor, métodos de pagamento e reconciliação.">
<link rel="icon" type="image/png" href="assets/globo.png">
<style>
/* Estilo do Portal do Grupo: azul-marinho escuro, menu lateral, cartões de vidro com ícone em azul */
:root{
  color-scheme:dark;
  --bg:#08122B; --bg2:#0C1A3D; --side:#0B1735; --side2:#0E1E45;
  --card:rgba(20,36,80,.55); --card2:rgba(26,46,100,.55); --line:rgba(140,170,230,.14); --line2:rgba(140,170,230,.24);
  --fg:#F2F5FC; --muted:#8FA3C8; --dim:#6B7FA6;
  --accent:#3F8CFF; --accent2:#2A6FE0; --sky:#6EC3FF; --navy:#1E4FB0;
  --ok:#3DD68C; --warn:#F5B547; --bad:#FF6B6B;
  --r:18px; --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 70% -10%,#13285C 0%,var(--bg) 55%) fixed,var(--bg);color:var(--fg);font:14px/1.45 var(--font);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}

/* menu lateral */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--side2),var(--side));border-right:1px solid var(--line);
  padding:22px 14px max(22px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand img{width:44px;height:36px;object-fit:contain}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.navg{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#DCE4F5;text-decoration:none;font-size:14.5px;margin:2px 0}
.nav a svg{width:19px;height:19px;flex:none;stroke:#BFD0EE;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(63,140,255,.08)}
.nav a.on{background:linear-gradient(90deg,rgba(63,140,255,.26),rgba(63,140,255,.10));color:#fff;box-shadow:inset 0 0 0 1px rgba(110,195,255,.18)}
.nav a.on svg{stroke:#fff}
.nav a .n{margin-left:auto;font-size:11px;font-weight:700;color:var(--warn);background:rgba(245,181,71,.14);border-radius:999px;padding:1px 8px}
.side-foot{margin-top:18px;padding:12px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}

/* área principal */
.main{min-width:0;padding-block:28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:600}
h1{margin:6px 0 0;font-size:clamp(26px,3.2vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.lead{color:var(--muted);margin:8px 0 0;max-width:70ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:9px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:rgba(63,140,255,.22);color:#fff}
.date{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.date input{background:transparent;border:0;color:var(--fg);font-size:12.5px;padding:3px 0;color-scheme:dark}
.btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid rgba(110,195,255,.35);background:linear-gradient(145deg,rgba(63,140,255,.32),rgba(42,111,224,.22));
  color:#fff;border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:600}
.btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}
.menu-btn{display:none}

/* cartões */
.glass{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 40px -26px rgba(0,0,0,.6)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px;margin-bottom:18px}
.tile{padding:16px 18px;display:grid;gap:4px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
.tile .s{font-size:12px;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.card-link{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px;min-height:206px;text-decoration:none;color:inherit;transition:transform .18s,border-color .18s}
.card-link:hover{transform:translateY(-2px);border-color:var(--line2)}
.ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#3C8BF0,#1E4FB0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -8px rgba(30,79,176,.9);margin-bottom:auto}
.ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.alt{background:linear-gradient(145deg,#5B6BD8,#33409E)}
.card-link .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-weight:600;margin-top:20px}
.card-link .t{font-size:20px;font-weight:750;letter-spacing:-.01em}
.card-link .d{font-size:13px;color:var(--muted)}
.badge{position:absolute;top:18px;right:18px;font-size:12px;font-weight:700;color:var(--warn);background:rgba(245,181,71,.13);border:1px solid rgba(245,181,71,.25);border-radius:999px;padding:4px 11px}
.badge.ok{color:var(--ok);background:rgba(61,214,140,.12);border-color:rgba(61,214,140,.25)}
.badge.bad{color:var(--bad);background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.28)}
.secs{display:grid;gap:18px}
.sec{padding:18px 18px 12px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.sec-h h2{margin:0;font-size:16.5px;font-weight:700}
.sec-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted);max-width:80ch}
.sec-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;width:min(100%,220px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}

/* tabelas */
.tw{overflow:auto;max-height:520px;border-radius:12px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;z-index:1;background:#12224C;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th button{all:unset;cursor:pointer}
td.n,th.n{text-align:right}
td.w{white-space:normal;min-width:180px}
tbody tr:hover td{background:rgba(63,140,255,.07)}
tfoot td{position:sticky;bottom:0;background:#132654;font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.p-ok{color:var(--ok);background:rgba(61,214,140,.12)}.p-warn{color:var(--warn);background:rgba(245,181,71,.13)}.p-bad{color:var(--bad);background:rgba(255,107,107,.13)}.p-mut{color:var(--muted);background:rgba(143,163,200,.12)}
.cbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.cbar i{display:block;height:6px;border-radius:6px;background:linear-gradient(90deg,#2A6FE0,#6EC3FF);min-width:2px}
.heat td.h{text-align:right;min-width:74px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--warn);background:rgba(245,181,71,.13);vertical-align:3px}

/* gráficos simples */
.bars{display:grid;gap:8px}
.bars .r{display:grid;grid-template-columns:minmax(120px,32%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bars .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#DCE4F5}
.bars .tr{height:10px;border-radius:10px;background:rgba(255,255,255,.05);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#1E4FB0,#3F8CFF 60%,#6EC3FF)}
.mix{display:flex;height:14px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);margin:6px 0 10px}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.note{font-size:12px;color:var(--dim);margin:8px 2px 0}

@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:30;transform:translateX(-105%);transition:transform .25s;height:100%}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .menu-btn{display:inline-flex;margin-bottom:12px}
  .tile .v{font-size:20px}
  .main{padding-top:max(18px,env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu">
    <div class="brand"><img src="assets/globo.png" alt=""><div><b>Grupo Naval Angola</b><span>Vendas Marketing</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="foot">A carregar dados…</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <button class="btn sm menu-btn" id="menu" type="button" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="titulo">A carregar…</h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="filters" aria-label="Filtro de datas">
        <div class="seg" id="presets"></div>
        <label class="date" for="de">De <input type="date" id="de"></label>
        <label class="date" for="ate">Até <input type="date" id="ate"></label>
        <button class="btn" id="exp" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Exportar CSV</button>
      </div>
    </div>
    <div id="page"></div>
  </main>
</div>

<script>
(() => {
  // ---------------- dados ----------------
  const FONTES = ['resumo', 'vendedores', 'produtos', 'facturas', 'stock', 'transportes', 'rtm', 'rotas', 'linhas', 'marcas', 'armazens'];
  const DB = {};
  const $ = (s) => document.querySelector(s);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const nf = new Intl.NumberFormat('pt-PT', { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat('pt-PT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const kz = (v) => (v == null || isNaN(v) ? '—' : nf.format(Math.round(v)) + ' Kz');
  const mkz = (v) => { if (v == null || isNaN(v)) return '—'; const a = Math.abs(v); return a >= 1e6 ? nf1.format(v / 1e6) + ' M Kz' : a >= 1e3 ? nf.format(v / 1e3) + ' mil Kz' : nf.format(v) + ' Kz'; };
  const n0 = (v) => (v == null || isNaN(v) ? '—' : nf.format(v));
  const pct = (v) => (v == null || isNaN(v) || !isFinite(v) ? '—' : nf1.format(v * 100) + '%');
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const dl = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
  const ds = (s) => { const [, m, d] = s.split('-'); return `${SEM[new Date(s + 'T12:00:00Z').getUTCDay()]} ${+d} ${MES[m - 1]}`; };
  const sum = (a, f) => a.reduce((s, x) => s + (+(typeof f === 'function' ? f(x) : x[f]) || 0), 0);
  const group = (a, k) => a.reduce((m, x) => { const g = typeof k === 'function' ? k(x) : x[k]; (m[g] || (m[g] = [])).push(x); return m; }, {});
  const ICON = {
    home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
    truck: 'M3 6h11v10H3zM14 9h4l3 3v4h-7M7.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z',
    ware: 'M3 9l9-5 9 5v11H3zM7 20v-7h10v7M7 16h10',
    box: 'M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8',
    card: 'M3 6h18v12H3zM3 10h18M7 15h4',
    chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
    tag: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01',
    scale: 'M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0zM8 21h8',
    route: 'M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8 17h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7',
    phone: 'M7 2h10v20H7zM11 18h2',
    file: 'M6 2h9l5 5v15H6zM14 2v6h6M9 13h7M9 17h7',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;

  // ---------------- estado ----------------
  const st = { de: null, ate: null, preset: 'mes' };
  let diasSap = [], diasTodos = [];
  const inR = (d) => d >= st.de && d <= st.ate;
  const marca = (c) => (DB.mapMarca[c] || {}).marca || 'Outros';
  const categoria = (c) => (DB.mapMarca[c] || {}).categoria || 'Outros';

  function presets() {
    const ult = diasSap[diasSap.length - 1] || diasTodos[diasTodos.length - 1];
    const fim = diasTodos[diasTodos.length - 1];
    const add = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
    return {
      ultimo: ['Último dia', ult, ult],
      sete: ['7 dias', add(fim, -6), fim],
      mes: ['Mês', fim.slice(0, 8) + '01', fim],
      tudo: ['Tudo', diasTodos[0], fim],
    };
  }
  function setPreset(k) {
    const p = presets()[k]; st.preset = k; st.de = p[1]; st.ate = p[2]; guardar(); draw();
  }
  function guardar() { try { localStorage.setItem('vm-filtro', JSON.stringify(st)); } catch (e) {} }
  function carregarFiltro() { try { const x = JSON.parse(localStorage.getItem('vm-filtro') || 'null'); if (x && x.de && x.ate) Object.assign(st, x); } catch (e) {} }

  // ---------------- tabelas e exportação ----------------
  let EXPORTS = [];
  const ORD = {};
  function csvCell(v) {
    if (v == null) return '';
    if (typeof v === 'number') return String(Math.round(v * 100) / 100).replace('.', ',');
    const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function csvOf(t) {
    const lines = [t.cols.map((c) => csvCell(c.label + (c.type === 'kz' ? ' (Kz)' : ''))).join(';')];
    t.rows.forEach((r) => lines.push(t.cols.map((c) => csvCell(c.csv ? c.csv(r) : c.get ? c.get(r) : r[c.key])).join(';')));
    return lines.join('\r\n');
  }
  function download(name, text) {
    const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const slug = (s) => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const fname = (t) => `vendas-marketing_${slug(t)}_${st.de}_${st.ate}.csv`;

  function cellNode(c, r, max) {
    const v = c.get ? c.get(r) : r[c.key];
    if (c.render) return c.render(v, r);
    if (c.type === 'kz') return document.createTextNode(kz(v));
    if (c.type === 'mkz') return document.createTextNode(mkz(v));
    if (c.type === 'n') return document.createTextNode(n0(v));
    if (c.type === 'pct') return document.createTextNode(pct(v));
    if (c.type === 'date') return document.createTextNode(dl(v));
    if (c.type === 'bar') { const w = el('span', 'cbar'); const i = el('i'); i.style.width = (max ? Math.max(2, (v / max) * 90) : 0) + 'px'; w.append(document.createTextNode(mkz(v)), i); return w; }
    return document.createTextNode(v == null || v === '' ? '—' : String(v));
  }
  function tabela(o) {
    // o: {id, titulo, nota, cols, rows, sort, dir, total, search, max}
    EXPORTS.push({ titulo: o.titulo, cols: o.cols, rows: o.rows });
    const sec = el('section', 'glass sec'); sec.id = 's-' + o.id;
    const h = el('div', 'sec-h'); const hl = el('div'); hl.append(el('h2', null, o.titulo)); if (o.nota) hl.append(el('p', null, o.nota));
    const tools = el('div', 'sec-tools');
    let q = '';
    if (o.search !== false) { const s = el('input', 'search'); s.type = 'search'; s.placeholder = 'Procurar…'; s.setAttribute('aria-label', 'Procurar em ' + o.titulo); s.id = 'q-' + o.id; s.addEventListener('input', () => { q = s.value.trim().toLowerCase(); body(); }); tools.append(s); }
    const b = el('button', 'btn sm'); b.type = 'button'; b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>CSV';
    b.addEventListener('click', () => download(fname(o.titulo), csvOf({ cols: o.cols, rows: filtradas() })));
    tools.append(b); h.append(hl, tools); sec.append(h);
    const tw = el('div', 'tw'); const tb = el('table'); tw.append(tb); sec.append(tw);
    if (o.extra) sec.append(o.extra);
    const ord = ORD[o.id] || (ORD[o.id] = { key: o.sort || o.cols[0].key, dir: o.dir || -1 });
    const val = (r, c) => (c.get ? c.get(r) : r[c.key]);
    const filtradas = () => (q ? o.rows.filter((r) => o.cols.some((c) => String(val(r, c) ?? '').toLowerCase().includes(q))) : o.rows);
    function body() {
      const rows = filtradas();
      const col = o.cols.find((c) => c.key === ord.key) || o.cols[0];
      const sorted = [...rows].sort((a, b2) => { const x = val(a, col), y = val(b2, col); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt')) * ord.dir; });
      const th = el('thead'); const tr = el('tr');
      o.cols.forEach((c) => {
        const t = el('th', c.type && c.type !== 'text' && c.type !== 'date' ? 'n' : null);
        t.setAttribute('aria-sort', c.key === ord.key ? (ord.dir > 0 ? 'ascending' : 'descending') : 'none');
        const bt = el('button', null, c.label + (c.key === ord.key ? (ord.dir > 0 ? ' ↑' : ' ↓') : '')); bt.type = 'button';

      cols: [{ key: 'promotor', label: 'Promotor' }, { key: 'numerario', label: 'Numerário', type: 'kz', sum: true }, { key: 'tpa', label: 'TPA', type: 'kz', sum: true }, { key: 'deposito', label: 'Depósito', type: 'kz', sum: true },
        { key: 'credito', label: 'Crédito', type: 'kz', sum: true }, { key: 'facturado', label: 'Facturado', type: 'kz', sum: true },
        { key: 'diferenca', label: 'Diferença', type: 'kz', sum: true, render: (v) => (Math.abs(v) < 1 ? pill('Confere', 'p-ok') : pill(kz(v), 'p-bad')) }] }));
    pg.append(secs);
  };

  R['vendas-global'] = (pg) => {
    const L = linhasR();
    const tot = sum(L, 'valor'), si = sum(L, 'valor_sem_iva'), d = sum(L, 'desconto'), dsi = sum(L, 'desconto_sem_iva');
    pg.append(tiles([
      { l: 'Vendas com IVA', v: mkz(tot) }, { l: 'Vendas sem IVA', v: mkz(si) }, { l: 'IVA', v: mkz(tot - si) },
      { l: 'Desconto com IVA', v: mkz(d), tone: d > 0 ? 'warn' : null }, { l: 'Desconto sem IVA', v: mkz(dsi) }, { l: 'Desconto / valor a preço padrão', v: pct(tot + d ? d / (tot + d) : null) },
    ]));
    const pr = Object.values(group(L, 'vendedor')).map((rs) => { const v = sum(rs, 'valor'), ds2 = sum(rs, 'desconto'); return { promotor: rs[0].vendedor, valor: v, sem_iva: sum(rs, 'valor_sem_iva'), iva: v - sum(rs, 'valor_sem_iva'), desconto: ds2, desconto_sem_iva: sum(rs, 'desconto_sem_iva'), pdesc: v + ds2 ? ds2 / (v + ds2) : null, caixas: sum(rs.filter((x) => x.unidade !== 'BAG'), 'qtd') }; });
    const secs = el('div', 'secs');
    secs.append(tabela({ id: 'vg-prom', titulo: 'Vendas e descontos por promotor', nota: 'Desconto = valor ao preço padrão − valor facturado. Sem IVA pelo rácio líquido/total de cada factura.', rows: pr, sort: 'valor', total: true,
      cols: [{ key: 'promotor', label: 'Promotor' }, { key: 'valor', label: 'Vendas c/ IVA', type: 'bar', sum: true, csv: (r) => r.valor }, { key: 'sem_iva', label: 'Vendas s/ IVA', type: 'kz', sum: true }, { key: 'iva', label: 'IVA', type: 'kz', sum: true },
        { key: 'desconto', label: 'Desconto c/ IVA', type: 'kz', sum: true }, { key: 'desconto_sem_iva', label: 'Desconto s/ IVA', type: 'kz', sum: true }, { key: 'pdesc', label: '% desconto', type: 'pct', sum: (rs) => { const a = sum(rs, 'valor'), b = sum(rs, 'desconto'); return a + b ? b / (a + b) : null; } },
        { key: 'caixas', label: 'Caixas', type: 'n', sum: true }] }));
    const pe = Object.values(group(L, 'empresa')).map((rs) => ({ empresa: rs[0].empresa, valor: sum(rs, 'valor'), sem_iva: sum(rs, 'valor_sem_iva'), desconto: sum(rs, 'desconto') }));
    const pd = Object.values(group(L, 'data')).map((rs) => ({ data: rs[0].data, valor: sum(rs, 'valor'), sem_iva: sum(rs, 'valor_sem_iva'), desconto: sum(rs, 'desconto'), desconto_sem_iva: sum(rs, 'desconto_sem_iva') }));
    const g = el('div', 'grid2');
    g.append(tabela({ id: 'vg-emp', titulo: 'Por empresa', rows: pe, sort: 'valor', total: true, search: false,
      cols: [{ key: 'empresa', label: 'Empresa' }, { key: 'valor', label: 'C/ IVA', type: 'kz', sum: true }, { key: 'sem_iva', label: 'S/ IVA', type: 'kz', sum: true }, { key: 'desconto', label: 'Desconto', type: 'kz', sum: true }] }));
    g.append(tabela({ id: 'vg-dia', titulo: 'Por dia', rows: pd, sort: 'data', total: true, search: false,
      cols: [{ key: 'data', label: 'Dia', type: 'date' }, { key: 'valor', label: 'C/ IVA', type: 'kz', sum: true }, { key: 'sem_iva', label: 'S/ IVA', type: 'kz', sum: true }, { key: 'desconto', label: 'Desc. c/ IVA', type: 'kz', sum: true }, { key: 'desconto_sem_iva', label: 'Desc. s/ IVA', type: 'kz', sum: true }] }));
    secs.append(g); pg.append(secs);
  };

  R['vendas-marca'] = (pg) => {
    const L = linhasR().map((x) => ({ ...x, marca: marca(x.codigo) }));
    const marcas = Object.values(group(L, 'marca')).map((rs) => ({ m: rs[0].marca, v: sum(rs, 'valor') })).sort((a, b) => b.v - a.v).map((x) => x.m);
    const secs = el('div', 'secs');
    const mat = Object.values(group(L, 'vendedor')).map((rs) => { const o = { promotor: rs[0].vendedor, total: sum(rs, 'valor') }; marcas.forEach((m) => { o[m] = sum(rs.filter((x) => x.marca === m), 'valor'); }); return o; });
    const mx = Math.max(1, ...mat.flatMap((o) => marcas.map((m) => o[m])));
    const heat = (v) => { const s = el('span'); s.textContent = v ? mkz(v) : '—'; if (v) { s.style.padding = '2px 6px'; s.style.borderRadius = '6px'; s.style.background = `rgba(63,140,255,${(0.1 + 0.6 * Math.sqrt(v / mx)).toFixed(2)})`; } else s.style.color = 'var(--dim)'; return s; };
    secs.append(tabela({ id: 'vm-mat', titulo: 'Promotor × marca (valor com IVA)', rows: mat, sort: 'total', total: true,
      cols: [{ key: 'promotor', label: 'Promotor' }, ...marcas.map((m) => ({ key: m, label: m, type: 'kz', sum: true, render: heat })), { key: 'total', label: 'Total', type: 'kz', sum: true }] }));
    const longo = Object.values(group(L, (x) => x.vendedor + '|' + x.marca)).map((rs) => ({ promotor: rs[0].vendedor, marca: rs[0].marca, caixas: sum(rs, 'qtd'), valor: sum(rs, 'valor'), sem_iva: sum(rs, 'valor_sem_iva'), desconto: sum(rs, 'desconto'), artigos: new Set(rs.map((x) => x.codigo)).size }));
    secs.append(tabela({ id: 'vm-long', titulo: 'Detalhe por promotor e marca', rows: longo, sort: 'valor', total: true,
      cols: [{ key: 'promotor', label: 'Promotor' }, { key: 'marca', label: 'Marca' }, { key: 'artigos', label: 'Artigos', type: 'n' }, { key: 'caixas', label: 'Qtd.', type: 'n', sum: true },
        { key: 'valor', label: 'C/ IVA', type: 'kz', sum: true }, { key: 'sem_iva', label: 'S/ IVA', type: 'kz', sum: true }, { key: 'desconto', label: 'Desconto', type: 'kz', sum: true }] }));
    const pm = Object.values(group(L, 'marca')).map((rs) => ({ marca: rs[0].marca, valor: sum(rs, 'valor'), sem_iva: sum(rs, 'valor_sem_iva'), promotores: new Set(rs.map((x) => x.vendedor)).size, caixas: sum(rs, 'qtd') }));
    secs.append(tabela({ id: 'vm-marca', titulo: 'Total por marca', rows: pm, sort: 'valor', total: true, search: false,
      cols: [{ key: 'marca', label: 'Marca' }, { key: 'valor', label: 'C/ IVA', type: 'bar', sum: true, csv: (r) => r.valor }, { key: 'sem_iva', label: 'S/ IVA', type: 'kz', sum: true }, { key: 'caixas', label: 'Qtd.', type: 'n', sum: true }, { key: 'promotores', label: 'Promotores', type: 'n' }] }));
    pg.append(secs);
  };

  R.reconciliacao = (pg) => {
    const res = DB.resumo.filter((x) => inR(x.data));
    const vd = DB.vendedores.filter((x) => inR(x.data));
    pg.append(tiles([
      { l: 'Diferença numerário', v: kz(sum(res, 'dif_numerario')), tone: Math.abs(sum(res, 'dif_numerario')) >= 1 ? 'bad' : 'ok' },
      { l: 'Diferença TPA', v: kz(sum(res, 'dif_tpa')), tone: Math.abs(sum(res, 'dif_tpa')) >= 1 ? 'bad' : 'ok' },
      { l: 'Vendedores com diferença', v: n0(vd.filter((x) => Math.abs(x.diferenca) >= 1).length), tone: vd.some((x) => Math.abs(x.diferenca) >= 1) ? 'bad' : 'ok' },
      { l: 'Saldo de caixa', v: mkz((res[res.length - 1] || {}).saldo_final), s: res.length ? 'em ' + dl(res[res.length - 1].data) : '' },
    ]));
    const secs = el('div', 'secs');
    secs.append(tabela({ id: 'rc-dia', titulo: 'Por dia', rows: res, sort: 'data', total: true, search: false,
      cols: [{ key: 'data', label: 'Dia', type: 'date' }, { key: 'numerario', label: 'Numerário SAP', type: 'kz', sum: true }, { key: 'numerario_entregue', label: 'Entregue', type: 'kz', sum: true },
        { key: 'dif_numerario', label: 'Dif.', type: 'kz', sum: true, render: (v) => (Math.abs(v) < 1 ? pill('0', 'p-ok') : pill(kz(v), 'p-bad')) }, { key: 'tpa', label: 'TPA SAP', type: 'kz', sum: true }, { key: 'tpa_bancos', label: 'Talões', type: 'kz', sum: true },
        { key: 'dif_tpa', label: 'Dif.', type: 'kz', sum: true, render: (v) => (Math.abs(v) < 1 ? pill('0', 'p-ok') : pill(kz(v), 'p-bad')) }, { key: 'saldo_final', label: 'Saldo de caixa', type: 'kz' }] }));
    secs.append(tabela({ id: 'rc-vend', titulo: 'Por vendedor e dia', nota: 'Diferença = numerário entregue + TPA + depósito + crédito − facturado.', rows: vd, sort: 'diferenca', total: true,
      cols: [{ key: 'data', label: 'Dia', type: 'date' }, { key: 'vendedor', label: 'Vendedor' }, { key: 'facturado', label: 'Facturado', type: 'kz', sum: true }, { key: 'numerario', label: 'Numerário', type: 'kz', sum: true },
        { key: 'tpa', label: 'TPA', type: 'kz', sum: true }, { key: 'deposito', label: 'Depósito', type: 'kz', sum: true }, { key: 'credito', label: 'Crédito', type: 'kz', sum: true },
        { key: 'diferenca', label: 'Diferença', type: 'kz', sum: true, render: (v) => (Math.abs(v) < 1 ? pill('Confere', 'p-ok') : pill(kz(v), 'p-bad')) }] }));
    pg.append(secs);
  };

  R.logistica = (pg) => {
    const T = DB.transportes.filter((x) => inR(x.data));
    const vend = T.filter((x) => x.vendido != null);
    pg.append(tiles([
      { l: 'Camiões', v: n0(T.length) }, { l: 'Caixas carregadas', v: n0(sum(T, 'carga')) },
      { l: 'Escoamento', v: pct(sum(vend, 'carga') ? sum(vend, 'vendido') / sum(vend, 'carga') : null), s: T.length > vend.length ? `${T.length - vend.length} camião(ões) sem SAP` : '' },
      { l: 'Camiões sem vendas', v: n0(vend.filter((x) => x.carga > 0 && x.vendido === 0).length) },
    ]));
    pg.append(tabela({ id: 'lg', titulo: 'Plano de cargas e escoamento', nota: 'Escoamento = caixas facturadas pelo vendedor ÷ caixas carregadas no camião.', rows: T, sort: 'data', total: true,
      cols: [{ key: 'data', label: 'Dia', type: 'date' }, { key: 'vendedor', label: 'Promotor' }, { key: 'motorista', label: 'Motorista' }, { key: 'matricula', label: 'Matrícula' }, { key: 'viatura', label: 'Viatura' },
        { key: 'n_zonas', label: 'Zonas', type: 'n' }, { key: 'zonas', label: 'Zonas de descarga', wrap: true }, { key: 'carga', label: 'Carga', type: 'n', sum: true }, { key: 'vendido', label: 'Vendido', type: 'n', sum: true },
        { key: 'escoamento', label: 'Escoamento', type: 'pct', render: (v) => (v == null ? pill('SAP pendente', 'p-mut') : pill(pct(v), v < 0.25 ? 'p-bad' : v < 0.5 ? 'p-warn' : 'p-ok')) }] }));
  };

  R.rtm = (pg) => {
    const D = DB.rtm.filter((x) => inR(x.data));
    pg.append(tiles([
      { l: 'Emitido no Pinguim', v: mkz(sum(D, 'total')), s: `${D.length} documentos` },
      { l: 'Casados com SAP', v: n0(D.filter((x) => x.factura_sap).length) },
      { l: 'Por liquidar', v: mkz(sum(D.filter((x) => !x.liquidado), 'total')), tone: D.some((x) => !x.liquidado) ? 'warn' : null },
      { l: 'Rotas validadas', v: `${DB.rotas.filter((x) => x.validado).length}/${DB.rotas.length}`, tone: 'warn' },
    ]));
    const secs = el('div', 'secs');
    const pv = Object.values(group(D, (x) => x.vendedor || x.vendedor_pinguim)).map((rs) => ({ vendedor: rs[0].vendedor || rs[0].vendedor_pinguim, rota: rs[0].rota, docs: rs.length, total: sum(rs, 'total'), casados: rs.filter((x) => x.factura_sap).length, por_liquidar: sum(rs.filter((x) => !x.liquidado), 'total') }));
    secs.append(tabela({ id: 'rt-v', titulo: 'Por vendedor', nota: 'Vendas emitidas no telemóvel (Naval General Trading). Não se somam às vendas SAP.', rows: pv, sort: 'total', total: true,
      cols: [{ key: 'vendedor', label: 'Vendedor' }, { key: 'rota', label: 'Rota' }, { key: 'docs', label: 'Documentos', type: 'n', sum: true }, { key: 'total', label: 'Total', type: 'kz', sum: true }, { key: 'casados', label: 'Casados SAP', type: 'n', sum: true }, { key: 'por_liquidar', label: 'Por liquidar', type: 'kz', sum: true }] }));
    secs.append(tabela({ id: 'rt-d', titulo: 'Documentos Pinguim', rows: D, sort: 'data', total: true,
      cols: [{ key: 'data', label: 'Dia', type: 'date' }, { key: 'hora', label: 'Hora' }, { key: 'documento', label: 'Documento' }, { key: 'cliente', label: 'Cliente', wrap: true }, { key: 'nif', label: 'NIF' }, { key: 'vendedor', label: 'Vendedor' },
        { key: 'total', label: 'Total', type: 'kz', sum: true }, { key: 'liquidado', label: 'Pago', render: (v) => pill(v ? 'Sim' : 'Não', v ? 'p-ok' : 'p-warn'), csv: (r) => (r.liquidado ? 'Sim' : 'Não') },
        { key: 'factura_sap', label: 'Factura SAP', render: (v) => (v ? document.createTextNode(v) : pill('Sem correspondência', 'p-mut')) }] }));
    secs.append(tabela({ id: 'rt-r', titulo: 'Correspondência rota ↔ vendedor', nota: 'A confirmar pela área comercial.', rows: DB.rotas, sort: 'rota', dir: 1, search: false,
      cols: [{ key: 'rota', label: 'Rota' }, { key: 'vendedor_pinguim', label: 'Nome no Pinguim' }, { key: 'vendedor_sap', label: 'Vendedor SAP' }, { key: 'validado', label: 'Estado', render: (v) => pill(v ? 'Confirmado' : 'Por validar', v ? 'p-ok' : 'p-warn'), csv: (r) => (r.validado ? 'Confirmado' : 'Por validar') }] }));
    pg.append(secs);
  };

  R.facturas = (pg) => {
    const F = DB.facturas.filter((x) => inR(x.data));
    pg.append(tabela({ id: 'fc', titulo: 'Facturas SAP', rows: F, sort: 'total', total: true,
      cols: [{ key: 'data', label: 'Dia', type: 'date' }, { key: 'factura', label: 'Factura' }, { key: 'empresa', label: 'Empresa' }, { key: 'cliente', label: 'Cliente', wrap: true }, { key: 'vendedor', label: 'Vendedor' },
        { key: 'numerario', label: 'Numerário', type: 'kz', sum: true }, { key: 'tpa', label: 'TPA', type: 'kz', sum: true }, { key: 'deposito', label: 'Depósito', type: 'kz', sum: true },
        { key: 'liquido', label: 'S/ IVA', type: 'kz', sum: true }, { key: 'total', label: 'C/ IVA', type: 'kz', sum: true }] }));
  };

  // ---------------- desenho ----------------
  function draw() {
    const p = PAGES.find((x) => x.id === atual) || PAGES[0];
    EXPORTS = [];
    $('#de').value = st.de; $('#ate').value = st.ate;
    const ps = presets(); const seg = $('#presets'); seg.replaceChildren();
    Object.entries(ps).forEach(([k, v]) => { const b = el('button', st.preset === k && st.de === v[1] && st.ate === v[2] ? 'on' : null, v[0]); b.type = 'button'; b.addEventListener('click', () => setPreset(k)); seg.append(b); });
    $('#eyebrow').textContent = (p.grupo || 'Vendas Marketing') + ' · ' + (st.de === st.ate ? ds(st.de) : `${dl(st.de)} a ${dl(st.ate)}`);
    $('#titulo').textContent = p.id === 'inicio' ? 'Onde pretende entrar?' : p.nome;
    const pend = diasTodos.filter((d) => inR(d) && !diasSap.includes(d));
    $('#lead').textContent = p.id === 'inicio' ? 'Stock, vendas e controlo diário da Marketing, a partir dos relatórios SAP, do plano de cargas e do Pinguim BO.' + (pend.length ? ` Sem relatórios SAP para ${pend.map(dl).join(', ')}.` : '') : '';
    const pg = $('#page'); pg.replaceChildren();
    try { R[p.id](pg); } catch (e) { console.error(e); pg.append(el('div', 'glass empty', 'Não foi possível desenhar esta página.')); }
    nav();
    document.title = (p.id === 'inicio' ? 'Vendas Marketing' : p.nome) + ' · Grupo Naval';
  }
  function route() { const h = location.hash.slice(1); atual = PAGES.some((x) => x.id === h) ? h : 'inicio'; draw(); window.scrollTo(0, 0); }

  $('#exp').addEventListener('click', () => {
    if (!EXPORTS.length) return;
    const p = PAGES.find((x) => x.id === atual);
    const txt = EXPORTS.map((t) => csvCell(t.titulo) + '\r\n' + csvOf(t)).join('\r\n\r\n');
    download(fname(p.nome), `${csvCell('Vendas Marketing · ' + p.nome)}\r\n${csvCell('Período: ' + dl(st.de) + ' a ' + dl(st.ate))}\r\n\r\n` + txt);
  });
  const onDate = () => { const a = $('#de').value, b = $('#ate').value; if (a && b && a <= b) { st.de = a; st.ate = b; st.preset = null; guardar(); draw(); } };
  $('#de').addEventListener('change', onDate); $('#ate').addEventListener('change', onDate);
  $('#menu').addEventListener('click', () => $('#app').classList.toggle('open'));
  addEventListener('hashchange', route);

  Promise.all(FONTES.map((id) => fetch('data/' + id + '.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : [])).catch(() => []).then((d) => { DB[id] = d; })))
    .then(() => {
      const arm = DB.armazens || {};
      DB.mapArm = Object.fromEntries((arm.armazens || []).map((x) => [x.armazem, x]));
      DB.mapCen = Object.fromEntries((arm.centros || []).map((x) => [x.centro, x]));
      DB.mapMarca = Object.fromEntries((DB.marcas || []).map((x) => [x.codigo, x]));
      ['resumo', 'vendedores', 'produtos', 'facturas', 'stock', 'transportes', 'rtm', 'rotas', 'linhas'].forEach((k) => { if (!Array.isArray(DB[k])) DB[k] = []; });
      diasSap = [...new Set(DB.resumo.map((x) => x.data))].sort();
      diasTodos = [...new Set([...diasSap, ...DB.transportes.map((x) => x.data), ...DB.rtm.map((x) => x.data)])].sort();
      if (!diasTodos.length) { $('#titulo').textContent = 'Sem dados'; return; }
      carregarFiltro();
      if (!st.de || !st.ate || st.de > diasTodos[diasTodos.length - 1]) { const p = presets().mes; st.de = p[1]; st.ate = p[2]; st.preset = 'mes'; }
      else if (st.preset) { const p = presets()[st.preset]; if (p) { st.de = p[1]; st.ate = p[2]; } }
      $('#foot').textContent = `Dados SAP até ${dl(diasSap[diasSap.length - 1])} · plano e Pinguim até ${dl(diasTodos[diasTodos.length - 1])}`;
      route();
    });
})();
</script>
</body>
</html>
