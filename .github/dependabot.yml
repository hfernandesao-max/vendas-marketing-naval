# Dependabot: verifica todas as semanas se há versões novas (e correcções de segurança) das dependências
# e abre pedidos de integração com a actualização. Os testes e a verificação de segurança correm em cada
# pedido; as actualizações de correcção (patch) e menores são integradas sozinhas quando tudo passa
# (.github/workflows/dependabot-integrar.yml, sem depender de definições do repositório). As maiores ficam para revisão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    open-pull-requests-limit: 5
    labels: [dependencias]
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    labels: [dependencias]
    groups:
      accoes:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    labels: [dependencias]
