# Testes automáticos a cada alteração enviada para o GitHub (e em cada pedido de integração):
#  - php:      sintaxe, testes unitários e testes dos serviços em cada versão do PHP suportada (7.1 a 8.3);
#  - analise:  análise estática do back-end (PHPStan);
#  - testes:   normas do front-end e testes do portal e do servidor (Playwright);
#  - apache:   regras dos .htaccess num Apache 2.4 real (ficheiros internos recusados, cabeçalhos).
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1' # todas as segundas-feiras (06:41 em Luanda): detecta mudanças no ambiente
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4', '8.1', '8.3']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, simplexml, openssl
          coverage: none

      - name: Sintaxe do PHP
        run: find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Testes unitários do back-end
        run: php tests/unidade/correr.php

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Testes dos serviços nesta versão do PHP
        run: npm ci && npx playwright test --project=servidor

  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Análise do PHP
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Ferramentas (composer)
        run: composer install --no-interaction --no-progress

      - name: Análise estática (PHPStan)
        run: composer analisar

  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Dependências de desenvolvimento
        run: npm ci

      - name: Sintaxe do PHP
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Normas de código
        run: npm run lint && npm run format:check

      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes do portal e do servidor
        run: npm test

      - name: Relatório dos testes (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-testes
          path: playwright-report/
          retention-days: 14

  apache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Regras do Apache
    steps:
      - uses: actions/checkout@v7

      - name: Apache 2.4 com PHP
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do
            sudo -E apt-get update -q && sudo -E apt-get install -y -q --no-install-recommends apache2 libapache2-mod-php && break
            sleep 10
          done

      - name: Ficheiros internos recusados, páginas servidas e cabeçalhos de segurança
        run: sudo bash tests/apache/verificar.sh
