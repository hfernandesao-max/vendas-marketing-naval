# ==============================================================================
# Configuração VirtualHost do Apache 2.4 para GeoMobilidadeNaval
# Domínio: geo.naval.co.ao:2051
# Diretório Raiz: C:\Apache24\htdocs\geo
# ==============================================================================

# 1. Habilitar escuta na porta 2051
Listen 2051

# 2. Configurar o VirtualHost
<VirtualHost *:2051>
    ServerName geo.naval.co.ao
    ServerAlias geo.naval.co.ao:2051
    DocumentRoot "C:/Apache24/htdocs/geo"

    # Suporte para acessar tanto diretamente na raiz como via /geo/
    Alias /geo "C:/Apache24/htdocs/geo"

    <Directory "C:/Apache24/htdocs/geo">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Logs de acesso e erros
    ErrorLog "logs/geo_error.log"
    CustomLog "logs/geo_access.log" combined
</VirtualHost>
