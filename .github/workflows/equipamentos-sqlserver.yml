# Módulo Equipamentos num SQL Server real (a CI normal usa SQLite):
#  - linux:   SQL Server 2022 em contentor, PHP 8.3 com pdo_sqlsrv;
#  - windows: SQL Server LocalDB, PHP com PDO_ODBC e o «ODBC Driver for SQL Server» (como no servidor de produção).
# Em cada um: o script oficial completo (com a carga inicial), a verificação da instalação e o cenário do módulo
# (registo, eventos, associações, documentos, assinaturas, substituição, abate e âmbito por perfil).
name: Equipamentos no SQL Server

on:
  pull_request:
    paths:
      - 'nucleo/servicos/equipamentos*.php'
      - 'nucleo/servicos/pdf-simples.php'
      - 'nucleo/servicos/bd.php'
      - 'nucleo/api/v1/equipamentos.php'
      - 'ferramentas/sql/**'
      - 'ferramentas/verificar-equipamentos.php'
      - 'tests/sqlserver/**'
      - 'tests/unidade/equipamentos/**'
      - '.github/workflows/equipamentos-sqlserver.yml'
  push:
    branches: [main]
    paths:
      - 'nucleo/servicos/equipamentos*.php'
      - 'ferramentas/sql/**'
      - 'tests/sqlserver/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: SQL Server 2022 (Linux, pdo_sqlsrv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlsrv, sqlsrv, gd, mbstring, pdo_sqlite
          coverage: none

      - name: SQL Server em contentor (palavra-passe gerada nesta execução)
        run: |
          SA="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::$SA"
          echo "SA=$SA" >> "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if php -r 'try { new PDO("sqlsrv:Server=127.0.0.1,1433;Encrypt=true;TrustServerCertificate=true", "sa", getenv("SA")); exit(0); } catch (Throwable $e) { exit(1); }'; then echo pronto; exit 0; fi
            sleep 3
          done
          docker logs mssql | tail -30
          exit 1

      - name: Bases de dados (oficial com a carga inicial; teste com a carga de teste)
        run: |
          B='sqlsrv:Server=127.0.0.1,1433;Encrypt=true;TrustServerCertificate=true;Database='
          php tests/sqlserver/executar.php "${B}master" sa "$SA" --sql "CREATE DATABASE GN_EQUIP_OFICIAL"
          php tests/sqlserver/executar.php "${B}master" sa "$SA" --sql "CREATE DATABASE GN_EQUIP_TESTE"
          php tests/sqlserver/executar.php "${B}GN_EQUIP_OFICIAL" sa "$SA" ferramentas/sql/equipamentos-sqlserver.sql
          php tests/sqlserver/executar.php "${B}GN_EQUIP_TESTE" sa "$SA" --sem-carga ferramentas/sql/equipamentos-sqlserver.sql tests/sqlserver/carga-teste.sql

      - name: Verificação da instalação (base oficial)
        run: |
          mkdir -p "$RUNNER_TEMP/v/privado"
          printf '%s\n' "DADOS_PRIVADOS=$RUNNER_TEMP/v/privado" "JWT_SEGREDO=$(openssl rand -hex 32)" \
            "ATV_DB_DSN=sqlsrv:Server=127.0.0.1,1433;Encrypt=true;TrustServerCertificate=true;Database=GN_EQUIP_OFICIAL" \
            "ATV_DB_USER=sa" "ATV_DB_PASS=$SA" > "$RUNNER_TEMP/v/.env"
          NAVAL_ENV="$RUNNER_TEMP/v/.env" php ferramentas/verificar-equipamentos.php

      - name: Cenário do módulo (base de teste)
        env:
          ATV_TESTE_DSN: 'sqlsrv:Server=127.0.0.1,1433;Encrypt=true;TrustServerCertificate=true;Database=GN_EQUIP_TESTE'
          ATV_TESTE_USER: sa
        run: ATV_TESTE_PASS="$SA" php tests/sqlserver/correr-cenario.php

  windows:
    name: SQL Server LocalDB (Windows, PDO_ODBC)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_odbc, gd, mbstring, pdo_sqlite
          coverage: none

      - name: SQL Server LocalDB e driver ODBC
        shell: pwsh
        run: |
          if (-not (Get-Command sqllocaldb -ErrorAction SilentlyContinue)) { choco install sqllocaldb -y --no-progress | Out-Null }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $env:Path
          sqllocaldb create Naval -s
          sqllocaldb info Naval
          $drivers = (Get-OdbcDriver -Platform 64-bit | Where-Object Name -like 'ODBC Driver * for SQL Server').Name
          Write-Output "Drivers ODBC: $($drivers -join ', ')"
          # o servidor de produção usa o ODBC Driver 17; se não houver, o 18
          $drv = if ($drivers -contains 'ODBC Driver 17 for SQL Server') { 'ODBC Driver 17 for SQL Server' } else { $drivers | Select-Object -First 1 }
          if (-not $drv) { throw 'Sem driver ODBC do SQL Server' }
          "ODBC=$drv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bases de dados (oficial com a carga inicial; teste com a carga de teste)
        shell: pwsh
        run: |
          $b = "odbc:Driver={$env:ODBC};Server=(localdb)\Naval;Trusted_Connection=yes;Encrypt=no;Database="
          php tests/sqlserver/executar.php "${b}master" - - --sql "CREATE DATABASE GN_EQUIP_OFICIAL"; if ($LASTEXITCODE) { exit 1 }
          php tests/sqlserver/executar.php "${b}master" - - --sql "CREATE DATABASE GN_EQUIP_TESTE"; if ($LASTEXITCODE) { exit 1 }
          php tests/sqlserver/executar.php "${b}GN_EQUIP_OFICIAL" - - ferramentas/sql/equipamentos-sqlserver.sql; if ($LASTEXITCODE) { exit 1 }
          php tests/sqlserver/executar.php "${b}GN_EQUIP_TESTE" - - --sem-carga ferramentas/sql/equipamentos-sqlserver.sql tests/sqlserver/carga-teste.sql; if ($LASTEXITCODE) { exit 1 }

      - name: Verificação da instalação (base oficial)
        shell: pwsh
        run: |
          $v = Join-Path $env:RUNNER_TEMP 'v'
          New-Item -ItemType Directory -Force (Join-Path $v 'privado') | Out-Null
          $segredo = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          @("DADOS_PRIVADOS=$v\privado", "JWT_SEGREDO=$segredo",
            "ATV_DB_DSN=odbc:Driver={$env:ODBC};Server=(localdb)\Naval;Trusted_Connection=yes;Encrypt=no;Database=GN_EQUIP_OFICIAL") |
            Out-File -FilePath (Join-Path $v '.env') -Encoding ascii
          $env:NAVAL_ENV = Join-Path $v '.env'
          php ferramentas/verificar-equipamentos.php; if ($LASTEXITCODE) { exit 1 }

      - name: Cenário do módulo (base de teste)
        shell: pwsh
        run: |
          $env:ATV_TESTE_DSN = "odbc:Driver={$env:ODBC};Server=(localdb)\Naval;Trusted_Connection=yes;Encrypt=no;Database=GN_EQUIP_TESTE"
          php tests/sqlserver/correr-cenario.php; if ($LASTEXITCODE) { exit 1 }
