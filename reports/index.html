<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal RTM · Grupo Naval</title>
  <meta name="description"
    content="Portal RTM do Grupo Naval Angola: vendas do Pinguim BO por promotor, dia e cliente, recebimentos, carga das carrinhas e carteira de clientes.">
  <link rel="icon" type="image/png" href="../assets/globo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- Estilos e código do portal: reports/css/ e reports/js/ (módulos ES) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tema.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">

</head>

<body>
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="ld-box">
      <div class="ld-logo" aria-hidden="true"><span class="ld-anel"></span><span class="ld-anel"></span><span class="ld-anel"></span><span class="ld-orbita"></span><img src="../assets/globo.png" alt=""></div>
      <div class="ld-titulo" id="ld-titulo">Portal RTM</div>
      <div class="ld-sub" id="ld-sub">A preparar os relatórios…</div>
      <div class="ld-barra"><i id="ld-barra"></i></div>
      <ul class="ld-passos" id="ld-passos"></ul>
    </div>
  </div>
  <div class="ld-topo" aria-hidden="true"></div>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Menu">
      <div class="brand"><img src="../assets/globo.png" alt="">
        <div><b>Grupo Naval</b><span id="brand-sub">Portal RTM</span></div>
      </div>
      <a class="back" href="../" id="voltar"><svg viewBox="0 0 24 24">
          <path d="M15 18l-6-6 6-6" />
        </svg><span id="voltar-t">Página principal</span></a>
      <button class="fontes" id="fontes" type="button" aria-expanded="false" aria-controls="fontes-det">
        <span class="l1"><i class="dot" id="fontes-dot"></i><span id="fontes-l1">A verificar as fontes de dados…</span></span>
        <span class="l2" id="fontes-l2"></span>
      </button>
      <div class="fontes-det" id="fontes-det" hidden></div>
      <div class="quem" id="quem" hidden></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="foot">…</div>
    </aside>
    <main class="main">
      <div class="top">
        <div>
          <button class="btn sm menu-btn" id="menu" type="button"><svg viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg><span id="menu-t">Menu</span></button>
          <button class="fontes-mini" id="fontes-mini" type="button"><i class="dot" id="fontes-mini-dot"></i><span id="fontes-mini-t"></span></button>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="titulo">…</h1>
          <p class="lead" id="lead"></p>
          <p class="actual" id="actual" aria-live="polite"></p>
        </div>
        <div class="filters">
          <div class="seg" id="presets"></div>
          <label class="date" for="de"><span id="l-de">De</span> <span class="dcampo"><input type="date" id="de"><span class="dv" id="de-v" aria-hidden="true"></span></span></label>
          <label class="date" for="ate"><span id="l-ate">Até</span> <span class="dcampo"><input type="date" id="ate"><span class="dv" id="ate-v" aria-hidden="true"></span></span></label>
          <button class="btn ghost" id="xl-page" type="button"><svg viewBox="0 0 24 24">
              <path d="M4 4h16v16H4zM4 9h16M9 9v11M8 13l3 4m0-4-3 4" />
            </svg><span></span></button>
          <button class="btn" id="xl-all" type="button"><svg viewBox="0 0 24 24">
              <path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" />
            </svg><span></span></button>
          <button class="btn ghost" id="xl-dados" type="button" hidden><svg viewBox="0 0 24 24">
              <path d="M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" />
            </svg><span></span></button>
          <div class="seg lang-top" id="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="pt">PT</button><button type="button" data-l="en">EN</button></div>
          <div class="filtros2 fb" id="filtros2" role="group" aria-label="Filtros" hidden></div>
        </div>
      </div>
      <div id="page"></div>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
